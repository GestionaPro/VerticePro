        html += &#x27;&lt;th class=&quot;colEstado&quot;&gt;Vencimiento&lt;/th&gt;&#x27;;
        html += &#x27;&lt;th class=&quot;colCheck&quot;&gt;&lt;/th&gt;&#x27;;
        html += &#x27;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&#x27;;

        items.forEach(function (t) {
          var dStatus = deadlineStatus(t);
          var rowCls = dStatus === &#x27;overdue&#x27; ? &#x27; overdue&#x27; : (dStatus === &#x27;today&#x27; ? &#x27; dueToday&#x27; : &#x27;&#x27;);
          var a = ageInfo(t);
          var semanasTxt = a ? (a.dias &lt; 7 ? (a.dias + &#x27;d&#x27;) : (Math.floor(a.dias / 7) + &#x27; sem&#x27;)) : &#x27;—&#x27;;
          var semCls = a ? (a.dias &gt;= 30 ? &#x27;ageOld&#x27; : (a.dias &gt;= 14 ? &#x27;ageMid&#x27; : &#x27;&#x27;)) : &#x27;&#x27;;
          var limiteTxt = t.fechaLimite ? formatoFechaCorta(t.fechaLimite) : &#x27;—&#x27;;
          var vencTxt = &#x27;—&#x27;, vencCls = &#x27;&#x27;;
          if (dStatus === &#x27;overdue&#x27;) { vencTxt = &#x27;Vencido&#x27;; vencCls = &#x27;vOverdue&#x27;; }
          else if (dStatus === &#x27;today&#x27;) { vencTxt = &#x27;Hoy&#x27;; vencCls = &#x27;vToday&#x27;; }
          else if (dStatus === &#x27;soon&#x27;) { vencTxt = &#x27;Pronto&#x27;; vencCls = &#x27;vSoon&#x27;; }
          else if (t.fechaLimite) { vencTxt = &#x27;En plazo&#x27;; vencCls = &#x27;vOk&#x27;; }

          html += &#x27;&lt;tr class=&quot;&#x27; + rowCls + &#x27;&quot;&gt;&#x27;;
          html += &#x27;&lt;td class=&quot;colCheck&quot;&gt;&lt;input type=&quot;checkbox&quot; class=&quot;checkbox&quot; data-done=&quot;&#x27; + t.id + &#x27;&quot;&gt;&lt;/td&gt;&#x27;;
          html += &#x27;&lt;td class=&quot;colTarea&quot;&gt;&#x27; + escapeHtml(t.tarea) + &#x27;&lt;/td&gt;&#x27;;
          html += &#x27;&lt;td class=&quot;colNum&quot;&gt;&lt;span class=&quot;gradeBadge&quot; style=&quot;&#x27; + gradeColorCss(t.calificacion) + &#x27;&quot;&gt;&#x27; + t.calificacion + &#x27;&lt;/span&gt;&lt;div class=&quot;subNum&quot;&gt;&#x27; + Math.round(t.puntaje) + &#x27;&lt;/div&gt;&lt;/td&gt;&#x27;;
          html += &#x27;&lt;td class=&quot;colNum&quot;&gt;&lt;span class=&quot;compactStars&quot;&gt;&#x27; + &#x27;★&#x27;.repeat(Number(t.importancia)) + &#x27;&lt;/span&gt;&lt;/td&gt;&#x27;;
          html += &#x27;&lt;td class=&quot;colFecha&quot;&gt;&#x27; + escapeHtml(limiteTxt) + &#x27;&lt;/td&gt;&#x27;;
          html += &#x27;&lt;td class=&quot;colNum &#x27; + semCls + &#x27;&quot;&gt;&#x27; + escapeHtml(semanasTxt) + &#x27;&lt;/td&gt;&#x27;;
          html += &#x27;&lt;td class=&quot;colEstado&quot;&gt;&lt;span class=&quot;vTag &#x27; + vencCls + &#x27;&quot;&gt;&#x27; + vencTxt + &#x27;&lt;/span&gt;&lt;/td&gt;&#x27;;
          html += &#x27;&lt;td class=&quot;colCheck&quot;&gt;&lt;button class=&quot;iconSmallBtn&quot; data-delete=&quot;&#x27; + t.id + &#x27;&quot;&gt;✕&lt;/button&gt;&lt;/td&gt;&#x27;;
          html += &#x27;&lt;/tr&gt;&#x27;;
        });

        html += &#x27;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
        document.getElementById(&#x27;main&#x27;).innerHTML = html;
        wireLista();
        return;
      }

      items.forEach(function (t) {
        var unclassified = !t.fechaLimite &amp;&amp; Number(t.importancia) === 3 &amp;&amp; Number(t.riesgo) === 3;
        var dateVal = t.fechaLimite ? String(t.fechaLimite).slice(0, 10) : &#x27;&#x27;;
        var isEditing = editingId === t.id;
        var dStatus = soloCompletados ? null : deadlineStatus(t);
        var cardExtraClass = dStatus === &#x27;overdue&#x27; ? &#x27;overdue&#x27; : (dStatus === &#x27;today&#x27; ? &#x27;dueToday&#x27; : &#x27;&#x27;);
        html += &#x27;&lt;div class=&quot;card &#x27; + cardExtraClass + &#x27;&quot; style=&quot;&#x27; + (soloCompletados ? &#x27;opacity:.65;&#x27; : &#x27;&#x27;) + &#x27;&quot;&gt;&#x27;;
        html += &#x27;&lt;div class=&quot;cardTop&quot;&gt;&lt;input type=&quot;checkbox&quot; class=&quot;checkbox&quot; &#x27; + (soloCompletados ? &#x27;checked&#x27; : &#x27;&#x27;) + &#x27; data-done=&quot;&#x27; + t.id + &#x27;&quot;&gt;&#x27;;
        html += &#x27;&lt;div style=&quot;flex:1;min-width:0;&quot;&gt;&#x27;;
        html += isEditing
          ? &#x27;&lt;input class=&quot;titleEdit&quot; data-title=&quot;&#x27; + t.id + &#x27;&quot; value=&quot;&#x27; + escapeAttr(t.tarea) + &#x27;&quot;&gt;&#x27;
          : &#x27;&lt;div class=&quot;cardTitle&quot; style=&quot;&#x27; + (soloCompletados ? &#x27;text-decoration:line-through;&#x27; : &#x27;&#x27;) + &#x27;&quot;&gt;&#x27; + escapeHtml(t.tarea) + &#x27;&lt;/div&gt;&#x27;;
        if (unclassified &amp;&amp; !isEditing) html += &#x27;&lt;span class=&quot;unclassifiedTag&quot;&gt;sin clasificar&lt;/span&gt;&#x27;;
        if (!isEditing) {
          // De qué tarea nació esta (si aplica)
          if (t.padre) {
            var padre = taskById(t.padre);
            if (padre) html += &#x27;&lt;div class=&quot;parentTag&quot;&gt;↳ nace de: &#x27; + escapeHtml(padre.tarea) + &#x27;&lt;/div&gt;&#x27;;
          }
          // Cuántas tareas nacieron de esta
          var hijas = (state.tasks || []).filter(function (h) { return h.padre === t.id; });
          if (hijas.length) {
            html += &#x27;&lt;div class=&quot;childTag&quot;&gt;&#x27; + hijas.length + &#x27; tarea&#x27; + (hijas.length === 1 ? &#x27;&#x27; : &#x27;s&#x27;) + &#x27; derivada&#x27; + (hijas.length === 1 ? &#x27;&#x27; : &#x27;s&#x27;) + &#x27;&lt;/div&gt;&#x27;;
          }
        }
        if (!isEditing &amp;&amp; !soloCompletados) html += deadlineBadge(t) + ageBadge(t);
        html += &#x27;&lt;/div&gt;&#x27;;
        html += &#x27;&lt;span class=&quot;gradeBadge&quot; style=&quot;&#x27; + gradeColorCss(t.calificacion) + &#x27;&quot;&gt;&#x27; + t.calificacion + &#x27;&lt;/span&gt;&#x27;;
        if (!soloCompletados) html += &#x27;&lt;button class=&quot;iconSmallBtn&quot; data-edit=&quot;&#x27; + t.id + &#x27;&quot;&gt;&#x27; + (isEditing ? &#x27;✓&#x27; : &#x27;✏️&#x27;) + &#x27;&lt;/button&gt;&#x27;;
        html += &#x27;&lt;button class=&quot;iconSmallBtn&quot; data-sub=&quot;&#x27; + t.id + &#x27;&quot; title=&quot;Crear tarea derivada de esta&quot;&gt;＋&lt;/button&gt;&#x27;;
        html += &#x27;&lt;button class=&quot;iconSmallBtn&quot; data-delete=&quot;&#x27; + t.id + &#x27;&quot;&gt;✕&lt;/button&gt;&lt;/div&gt;&#x27;;

        if (soloCompletados) {
          html += &#x27;&lt;div class=&quot;detailMeta&quot;&gt;tiempo invertido &#x27; + fmtDuration(t.tiempoInvertidoSeg) + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
          return;
        }

        html += &#x27;&lt;div class=&quot;cardCriteria&quot;&gt;&lt;div class=&quot;criteriaBlock&quot;&gt;&lt;span class=&quot;criteriaLabel&quot;&gt;Importancia&lt;/span&gt;&lt;div class=&quot;starGroup&quot;&gt;&#x27;;
        for (var n = 1; n &lt;= 5; n++) {
          html += &#x27;&lt;button class=&quot;starBtn &#x27; + (n &lt;= t.importancia ? &#x27;on&#x27; : &#x27;&#x27;) + &#x27;&quot; data-star=&quot;&#x27; + t.id + &#x27;&quot; data-n=&quot;&#x27; + n + &#x27;&quot;&gt;★&lt;/button&gt;&#x27;;
        }
        html += &#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
        html += &#x27;&lt;div class=&quot;criteriaBlock&quot;&gt;&lt;span class=&quot;criteriaLabel&quot;&gt;Riesgo&lt;/span&gt;&lt;div class=&quot;starGroup&quot;&gt;&#x27;;
        for (var r = 1; r &lt;= 5; r++) {
          html += &#x27;&lt;button class=&quot;starBtn &#x27; + (r &lt;= t.riesgo ? &#x27;riskOn&#x27; : &#x27;&#x27;) + &#x27;&quot; data-risk=&quot;&#x27; + t.id + &#x27;&quot; data-n=&quot;&#x27; + r + &#x27;&quot;&gt;★&lt;/button&gt;&#x27;;
        }
        html += &#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
        html += &#x27;&lt;div class=&quot;criteriaBlock&quot;&gt;&lt;span class=&quot;criteriaLabel&quot;&gt;Recompensa&lt;/span&gt;&lt;div class=&quot;rewardChips&quot;&gt;&#x27;;
        [[1, &#x27;Baja&#x27;], [3, &#x27;Media&#x27;], [5, &#x27;Alta&#x27;]].forEach(function (opt) {
          html += &#x27;&lt;button class=&quot;rewardChip &#x27; + (Number(t.recompensa) === opt[0] ? &#x27;active&#x27; : &#x27;&#x27;) + &#x27;&quot; data-reward=&quot;&#x27; + t.id + &#x27;&quot; data-val=&quot;&#x27; + opt[0] + &#x27;&quot;&gt;&#x27; + opt[1] + &#x27;&lt;/button&gt;&#x27;;
        });
        html += &#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
        html += &#x27;&lt;div class=&quot;criteriaBlock&quot;&gt;&lt;span class=&quot;criteriaLabel&quot;&gt;Fecha límite&lt;/span&gt;&lt;div style=&quot;display:flex;align-items:center;gap:6px;&quot;&gt;&#x27;;
        html += &#x27;&lt;input type=&quot;date&quot; class=&quot;dateEdit&quot; data-deadline=&quot;&#x27; + t.id + &#x27;&quot; value=&quot;&#x27; + dateVal + &#x27;&quot;&gt;&#x27;;
        if (t.fechaLimite) html += &#x27;&lt;button class=&quot;clearDateBtn&quot; data-cleardate=&quot;&#x27; + t.id + &#x27;&quot;&gt;✕&lt;/button&gt;&#x27;;
        html += &#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
        // Tiempo estimado con botones - / + (pasos de 10 min, mínimo 10)
        var estimado = Number(t.esfuerzo) || 10;
        html += &#x27;&lt;div class=&quot;criteriaBlock&quot;&gt;&lt;span class=&quot;criteriaLabel&quot;&gt;Tiempo estimado&lt;/span&gt;&#x27;;
        html += &#x27;&lt;div class=&quot;timeStepper&quot;&gt;&#x27;;
        html += &#x27;&lt;button class=&quot;stepBtn&quot; data-time-minus=&quot;&#x27; + t.id + &#x27;&quot; data-cur=&quot;&#x27; + estimado + &#x27;&quot;&gt;−&lt;/button&gt;&#x27;;
        html += &#x27;&lt;input class=&quot;timeInput&quot; data-time-edit=&quot;&#x27; + t.id + &#x27;&quot; value=&quot;&#x27; + escapeAttr(fmtEstimado(estimado)) + &#x27;&quot; inputmode=&quot;text&quot; title=&quot;Escribe 45, 1h, 1h 30 o 2h&quot;&gt;&#x27;;
        html += &#x27;&lt;button class=&quot;stepBtn&quot; data-time-plus=&quot;&#x27; + t.id + &#x27;&quot; data-cur=&quot;&#x27; + estimado + &#x27;&quot;&gt;+&lt;/button&gt;&#x27;;
        html += &#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;

        // Fecha y hora planeada: agenda la tarea en el calendario desde aquí.
        var agendada = (state.assignments || []).find(function (a) { return a.idTarea === t.id; });
        html += &#x27;&lt;div class=&quot;criteriaBlock&quot;&gt;&lt;span class=&quot;criteriaLabel&quot;&gt;Planeado&lt;/span&gt;&#x27;;
        if (agendada) {
          html += &#x27;&lt;div class=&quot;plannedRow&quot;&gt;&lt;span class=&quot;plannedTag&quot;&gt;&#x27; +
            escapeHtml(textoPlaneado(agendada)) + &#x27;&lt;/span&gt;&#x27; +
            &#x27;&lt;button class=&quot;clearDateBtn&quot; data-unplan=&quot;&#x27; + agendada.id + &#x27;&quot;&gt;✕&lt;/button&gt;&lt;/div&gt;&#x27;;
        } else {
          html += &#x27;&lt;button class=&quot;planBtn&quot; data-plan=&quot;&#x27; + t.id + &#x27;&quot;&gt;📅 Agendar&lt;/button&gt;&#x27;;
        }
        html += &#x27;&lt;/div&gt;&#x27;;
        html += &#x27;&lt;/div&gt;&#x27;;

        html += &#x27;&lt;div class=&quot;cardBottom&quot;&gt;&lt;span class=&quot;timeReadout&quot;&gt;&#x27; + fmtDuration(t.tiempoInvertidoSeg) + &#x27;&lt;/span&gt;&#x27;;
        var running = !!t.cronometroInicio;
        html += &#x27;&lt;button class=&quot;timerBtn&quot; data-timer=&quot;&#x27; + t.id + &#x27;&quot; style=&quot;background:&#x27; + (running ? &#x27;#FF6B35&#x27; : &#x27;#00D9A3&#x27;) + &#x27;;&quot;&gt;&#x27; + (running ? &#x27;Pausar&#x27; : &#x27;Iniciar&#x27;) + &#x27;&lt;/button&gt;&lt;/div&gt;&#x27;;
        html += &#x27;&lt;/div&gt;&#x27;;
      });

      html += &#x27;&lt;/div&gt;&#x27;;
      document.getElementById(&#x27;main&#x27;).innerHTML = html;
      wireLista();
    }

    function wireLista() {
      // Buscador: filtra mientras escribes, conservando el cursor.
      var inp = document.getElementById(&#x27;buscarLista&#x27;);
      if (inp) {
        inp.addEventListener(&#x27;input&#x27;, function () {
          busquedaLista = inp.value;
          var pos = inp.selectionStart;
          render();
          var nuevo = document.getElementById(&#x27;buscarLista&#x27;);
          if (nuevo) {
            nuevo.focus();
            try { nuevo.setSelectionRange(pos, pos); } catch (e) {}
          }
        });
      }
      var limpiar = document.getElementById(&#x27;limpiarBusqueda&#x27;);
      if (limpiar) limpiar.addEventListener(&#x27;click&#x27;, function () {
        busquedaLista = &#x27;&#x27;;
        render();
      });

      document.querySelectorAll(&#x27;[data-done]&#x27;).forEach(function (el) {
        el.addEventListener(&#x27;change&#x27;, function () {
          google.script.run.withSuccessHandler(onData).withFailureHandler(onError).toggleDone(el.getAttribute(&#x27;data-done&#x27;));
        });
      });
      document.querySelectorAll(&#x27;[data-sub]&#x27;).forEach(function (el) {
        el.addEventListener(&#x27;click&#x27;, function () {
          crearDerivada(el.getAttribute(&#x27;data-sub&#x27;));
        });
      });

      document.querySelectorAll(&#x27;[data-delete]&#x27;).forEach(function (el) {
        el.addEventListener(&#x27;click&#x27;, function () {
          if (!confirm(&#x27;¿Eliminar este pendiente?&#x27;)) return;
          google.script.run.withSuccessHandler(onData).withFailureHandler(onError).deleteTask(el.getAttribute(&#x27;data-delete&#x27;));
        });
      });
      document.querySelectorAll(&#x27;[data-edit]&#x27;).forEach(function (el) {
        el.addEventListener(&#x27;click&#x27;, function () {
          var id = el.getAttribute(&#x27;data-edit&#x27;);
          editingId = editingId === id ? null : id;
          renderLista(false);
        });
      });
      document.querySelectorAll(&#x27;[data-title]&#x27;).forEach(function (el) {
        el.addEventListener(&#x27;change&#x27;, function () {
          google.script.run.withSuccessHandler(onData).withFailureHandler(onError).updateTask(el.getAttribute(&#x27;data-title&#x27;), { tarea: el.value });
        });
      });
      document.querySelectorAll(&#x27;[data-star]&#x27;).forEach(function (el) {
        el.addEventListener(&#x27;click&#x27;, function () {
          var id = el.getAttribute(&#x27;data-star&#x27;), n = el.getAttribute(&#x27;data-n&#x27;);
          google.script.run.withSuccessHandler(onData).withFailureHandler(onError).updateTask(id, { importancia: n });
        });
      });
      document.querySelectorAll(&#x27;[data-risk]&#x27;).forEach(function (el) {
        el.addEventListener(&#x27;click&#x27;, function () {
          var id = el.getAttribute(&#x27;data-risk&#x27;), n = el.getAttribute(&#x27;data-n&#x27;);
          google.script.run.withSuccessHandler(onData).withFailureHandler(onError).updateTask(id, { riesgo: n });
        });
      });
      document.querySelectorAll(&#x27;[data-reward]&#x27;).forEach(function (el) {
        el.addEventListener(&#x27;click&#x27;, function () {
          var id = el.getAttribute(&#x27;data-reward&#x27;), n = el.getAttribute(&#x27;data-val&#x27;);
          google.script.run.withSuccessHandler(onData).withFailureHandler(onError).updateTask(id, { recompensa: n });
        });
      });
      document.querySelectorAll(&#x27;[data-deadline]&#x27;).forEach(function (el) {
        el.addEventListener(&#x27;change&#x27;, function () {
          var id = el.getAttribute(&#x27;data-deadline&#x27;);
          var v = el.value ? el.value + &#x27;T18:00&#x27; : &#x27;&#x27;;
          google.script.run.withSuccessHandler(onData).withFailureHandler(onError).updateTask(id, { fechaLimite: v });
        });
      });
      document.querySelectorAll(&#x27;[data-cleardate]&#x27;).forEach(function (el) {
        el.addEventListener(&#x27;click&#x27;, function () {
          google.script.run.withSuccessHandler(onData).withFailureHandler(onError).updateTask(el.getAttribute(&#x27;data-cleardate&#x27;), { fechaLimite: &#x27;&#x27; });
        });
      });
      // Agendar desde la tarjeta del pendiente
      document.querySelectorAll(&#x27;[data-plan]&#x27;).forEach(function (el) {
        el.addEventListener(&#x27;click&#x27;, function () {
          abrirAgendarDesdePendiente(el.getAttribute(&#x27;data-plan&#x27;));
        });
      });
      document.querySelectorAll(&#x27;[data-unplan]&#x27;).forEach(function (el) {
        el.addEventListener(&#x27;click&#x27;, function () {
          if (!confirm(&#x27;¿Quitar esta tarea del calendario?&#x27;)) return;
          google.script.run.withSuccessHandler(onData).withFailureHandler(onError)
            .removeAssignment(el.getAttribute(&#x27;data-unplan&#x27;));
        });
      });

      document.querySelectorAll(&#x27;[data-time-minus]&#x27;).forEach(function (el) {
        el.addEventListener(&#x27;click&#x27;, function () {
          var cur = Number(el.getAttribute(&#x27;data-cur&#x27;)) || 10;
          var nuevo = Math.max(10, cur - 10);
          if (nuevo === cur) return;
          google.script.run.withSuccessHandler(onData).withFailureHandler(onError)
            .updateTask(el.getAttribute(&#x27;data-time-minus&#x27;), { esfuerzo: nuevo });
        });
      });
      // Escribir el tiempo a mano: acepta &quot;45&quot;, &quot;1h&quot;, &quot;1h 30&quot;, &quot;90 min&quot;, &quot;2h&quot;
      document.querySelectorAll(&#x27;[data-time-edit]&#x27;).forEach(function (el) {
        el.addEventListener(&#x27;focus&#x27;, function () { el.select(); });
        el.addEventListener(&#x27;change&#x27;, function () {
          var min = parseDuracion(el.value);
          if (min === null) { alert(&#x27;No entendí ese tiempo. Escribe por ejemplo: 45, 1h, 1h 30 o 2h&#x27;); render(); return; }
          google.script.run.withSuccessHandler(onData).withFailureHandler(onError)
            .updateTask(el.getAttribute(&#x27;data-time-edit&#x27;), { esfuerzo: min });
        });
      });

      document.querySelectorAll(&#x27;[data-time-plus]&#x27;).forEach(function (el) {
        el.addEventListener(&#x27;click&#x27;, function () {
          var cur = Number(el.getAttribute(&#x27;data-cur&#x27;)) || 10;
          google.script.run.withSuccessHandler(onData).withFailureHandler(onError)
            .updateTask(el.getAttribute(&#x27;data-time-plus&#x27;), { esfuerzo: cur + 10 });
        });
      });
      document.querySelectorAll(&#x27;[data-timer]&#x27;).forEach(function (el) {
        el.addEventListener(&#x27;click&#x27;, function () {
          var id = el.getAttribute(&#x27;data-timer&#x27;);
          var t = taskById(id);
          var fn = (t &amp;&amp; t.cronometroInicio) ? &#x27;stopTimer&#x27; : &#x27;startTimer&#x27;;
          google.script.run.withSuccessHandler(onData).withFailureHandler(onError)[fn](id);
        });
      });
    }

    // Agendar un pendiente eligiendo semana, día y hora.
    function abrirAgendarDesdePendiente(idTarea) {
      var t = taskById(idTarea);
      if (!t) return;

      var r = rangoComun();
      var horasDisp = [];
      for (var m = r.inicio; m &lt; r.fin; m += state.slotMin) horasDisp.push(m);

      var html = &#x27;&lt;div class=&quot;pickerBackdrop&quot; id=&quot;pickerBackdrop&quot;&gt;&lt;div class=&quot;pickerBox&quot;&gt;&#x27;;
      html += &#x27;&lt;div class=&quot;pickerHead&quot;&gt;📅 Agendar&lt;div class=&quot;pickerWhen&quot;&gt;&#x27; + escapeHtml(t.tarea) + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;

      html += &#x27;&lt;div class=&quot;pickerSub&quot;&gt;Semana&lt;/div&gt;&lt;div class=&quot;cfgChips&quot; id=&quot;planSem&quot;&gt;&#x27;;
      [0, 1, 2].forEach(function (off) {
        var ini = addDays(startOfWeek(clientNow), off * 7);
        var etq = off === 0 ? &#x27;Esta&#x27; : (off === 1 ? &#x27;Siguiente&#x27; : &#x27;En 2&#x27;);
        html += &#x27;&lt;button class=&quot;cfgChip &#x27; + (off === 0 ? &#x27;on&#x27; : &#x27;&#x27;) + &#x27;&quot; data-psem=&quot;&#x27; + off + &#x27;&quot;&gt;&#x27; +
                etq + &#x27;&lt;br&gt;&lt;small&gt;&#x27; + ini.toLocaleDateString(undefined, { day: &#x27;2-digit&#x27;, month: &#x27;short&#x27; }) + &#x27;&lt;/small&gt;&lt;/button&gt;&#x27;;
      });
      html += &#x27;&lt;/div&gt;&#x27;;

      // Solo los días activos según Ajustes.
      var activos = diasActivos();
      if (activos.length === 0) {
        alert(&#x27;No tienes días laborales configurados. Ve a Ajustes → Mi horario.&#x27;);
        return;
      }
      html += &#x27;&lt;div class=&quot;pickerSub&quot;&gt;Día&lt;/div&gt;&lt;div class=&quot;cfgChips&quot; id=&quot;planDia&quot;&gt;&#x27;;
      activos.forEach(function (di, idx) {
        html += &#x27;&lt;button class=&quot;cfgChip &#x27; + (idx === 0 ? &#x27;on&#x27; : &#x27;&#x27;) + &#x27;&quot; data-pdia=&quot;&#x27; + di + &#x27;&quot;&gt;&#x27; +
                state.dayNames[di].slice(0, 3) + &#x27;&lt;/button&gt;&#x27;;
      });
      html += &#x27;&lt;/div&gt;&#x27;;

      html += &#x27;&lt;div class=&quot;pickerSub&quot;&gt;Hora&lt;/div&gt;&lt;div class=&quot;planHoras&quot; id=&quot;planHora&quot;&gt;&#x27;;
      horasDisp.forEach(function (m, i) {
        html += &#x27;&lt;button class=&quot;cfgChip &#x27; + (i === 0 ? &#x27;on&#x27; : &#x27;&#x27;) + &#x27;&quot; data-phora=&quot;&#x27; + m + &#x27;&quot;&gt;&#x27; + fmtMin(m) + &#x27;&lt;/button&gt;&#x27;;
      });
      html += &#x27;&lt;/div&gt;&#x27;;

      html += &#x27;&lt;button class=&quot;pickerNew&quot; id=&quot;planConfirmar&quot;&gt;Agendar aquí&lt;/button&gt;&#x27;;
      html += &#x27;&lt;button class=&quot;pickerCancel&quot; id=&quot;pickerCancelar&quot;&gt;Cancelar&lt;/button&gt;&#x27;;
      html += &#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;

      var cont = document.createElement(&#x27;div&#x27;);
      cont.innerHTML = html;
      document.body.appendChild(cont.firstChild);

      function marcar(grupo, attr) {
        document.querySelectorAll(&#x27;#&#x27; + grupo + &#x27; [&#x27; + attr + &#x27;]&#x27;).forEach(function (b) {
          b.addEventListener(&#x27;click&#x27;, function () {
            document.querySelectorAll(&#x27;#&#x27; + grupo + &#x27; [&#x27; + attr + &#x27;]&#x27;).forEach(function (x) { x.classList.remove(&#x27;on&#x27;); });
            b.classList.add(&#x27;on&#x27;);
          });
        });
      }
      marcar(&#x27;planSem&#x27;, &#x27;data-psem&#x27;);
      marcar(&#x27;planDia&#x27;, &#x27;data-pdia&#x27;);
      marcar(&#x27;planHora&#x27;, &#x27;data-phora&#x27;);

      document.getElementById(&#x27;pickerCancelar&#x27;).addEventListener(&#x27;click&#x27;, cerrarSelector);
      document.getElementById(&#x27;pickerBackdrop&#x27;).addEventListener(&#x27;click&#x27;, function (ev) {
        if (ev.target &amp;&amp; ev.target.id === &#x27;pickerBackdrop&#x27;) cerrarSelector();
      });

      document.getElementById(&#x27;planConfirmar&#x27;).addEventListener(&#x27;click&#x27;, function () {
        var selSem = document.querySelector(&#x27;#planSem .cfgChip.on&#x27;);
        var selDia = document.querySelector(&#x27;#planDia .cfgChip.on&#x27;);
        var selHora = document.querySelector(&#x27;#planHora .cfgChip.on&#x27;);
        if (!selSem || !selDia || !selHora) { alert(&#x27;Elige semana, día y hora.&#x27;); return; }

        var off = Number(selSem.getAttribute(&#x27;data-psem&#x27;));
        var dia = Number(selDia.getAttribute(&#x27;data-pdia&#x27;));
        var hora = Number(selHora.getAttribute(&#x27;data-phora&#x27;));

        var lunes = addDays(startOfWeek(clientNow), off * 7);
        var clave = lunes.getFullYear() + &#x27;-&#x27; + pad(lunes.getMonth() + 1) + &#x27;-&#x27; + pad(lunes.getDate());

        // No se puede agendar en el pasado.
        if (esMomentoPasado(off, dia, hora)) {
          alert(&#x27;Ese horario ya pasó. Elige un momento futuro.&#x27;);
          return;
        }

        cerrarSelector();
        google.script.run.withSuccessHandler(onData).withFailureHandler(onError)
          .assignBlock(dia, hora, idTarea, clave);
      });
    }

    // Crea una tarea nueva que nace de otra (por ejemplo, algo que surgió
    // al ejecutar una tarea y hay que hacer después).
    function crearDerivada(idPadre) {
      var padre = taskById(idPadre);
      if (!padre) return;
      var titulo = prompt(&#x27;Nueva tarea que nace de &quot;&#x27; + padre.tarea + &#x27;&quot;:&#x27;);
      if (!titulo) return;
      titulo = String(titulo).trim();
      if (!titulo) return;

      var note = document.getElementById(&#x27;syncNote&#x27;);
      if (note) note.textContent = &#x27;guardando…&#x27;;

      google.script.run.withSuccessHandler(onData).withFailureHandler(onError).addTask({
        tarea: titulo,
        importancia: padre.importancia,
        riesgo: padre.riesgo,
        recompensa: padre.recompensa,
        esfuerzo: 30,
        fechaLimite: &#x27;&#x27;,
        padre: idPadre
      });
    }

    /* ===================== DASHBOARD ===================== */
    /* ===================== ÍNDICE VÉRTICE =====================
       100 puntos posibles:
         30 → completar prioridades (el Top 3 del día)
         25 → cumplir bloques (lo asignado en time boxing)
         20 → mantener Q2 (planificar antes de que sea emergencia)
         15 → evitar vencimientos
         10 → cierre diario (registrar tiempo con el cronómetro)      */
    function calcularIndiceVertice() {
      var todas = state.tasks;
      var pendientes = todas.filter(function (t) { return t.estado !== &#x27;Completada&#x27;; });
      var completadas = todas.filter(function (t) { return t.estado === &#x27;Completada&#x27;; });

      // Ranking actual por calificación (define cuáles son &quot;las prioridades&quot;)
      var rank = pendientes.slice().sort(function (a, b) { return b.puntaje - a.puntaje; });

      // 1) PRIORIDADES (30) — proporción de completadas sobre el total
      var totalRelevante = todas.length;
      var pPrioridades = totalRelevante &gt; 0
        ? (completadas.length / totalRelevante) * 30
        : 0;

      // 2) BLOQUES (25) — cuánto de lo pendiente tiene un bloque asignado
      var conBloque = pendientes.filter(function (t) {
        return state.assignments.some(function (a) { return a.idTarea === t.id; });
      }).length;
      var pBloques = pendientes.length &gt; 0
        ? (conBloque / pendientes.length) * 25
        : 25;

      // 3) Q2 (20) — planificar antes de la emergencia.
      //    Mide qué parte de lo importante está en Q2 (planificar) y no en Q1 (hacer ahora).
      var importantes = pendientes.filter(function (t) {
        return t.cuadrante === &#x27;hacer&#x27; || t.cuadrante === &#x27;planificar&#x27;;
      });
      var enQ2 = importantes.filter(function (t) { return t.cuadrante === &#x27;planificar&#x27;; }).length;
      var pQ2 = importantes.length &gt; 0
        ? (enQ2 / importantes.length) * 20
        : 20;

      // 4) VENCIMIENTOS (15) — penaliza lo vencido
      var vencidas = pendientes.filter(function (t) { return deadlineStatus(t) === &#x27;overdue&#x27;; }).length;
      var pVenc = pendientes.length &gt; 0
        ? Math.max(0, (1 - (vencidas / pendientes.length))) * 15
        : 15;

      // 5) CIERRE DIARIO (10) — registrar tiempo real con el cronómetro
      var conTiempo = todas.filter(function (t) { return (Number(t.tiempoInvertidoSeg) || 0) &gt; 0; }).length;
      var pCierre = totalRelevante &gt; 0
        ? (conTiempo / totalRelevante) * 10
        : 0;

      var total = Math.round(pPrioridades + pBloques + pQ2 + pVenc + pCierre);
      if (total &gt; 100) total = 100;
      if (total &lt; 0) total = 0;

      var etiqueta, color;
      if (total &gt;= 85) { etiqueta = &#x27;Excelente ejecución&#x27;; color = &#x27;#00D9A3&#x27;; }
      else if (total &gt;= 70) { etiqueta = &#x27;Buena ejecución&#x27;; color = &#x27;#5FD1FF&#x27;; }
      else if (total &gt;= 50) { etiqueta = &#x27;Ejecución irregular&#x27;; color = &#x27;#FFC145&#x27;; }
      else { etiqueta = &#x27;Necesita enfoque&#x27;; color = &#x27;#FF6B35&#x27;; }

      return {
        total: total, etiqueta: etiqueta, color: color,
        partes: [
          { nombre: &#x27;Prioridades completadas&#x27;, valor: pPrioridades, max: 30 },
          { nombre: &#x27;Bloques planificados&#x27;, valor: pBloques, max: 25 },
          { nombre: &#x27;Mantener Q2&#x27;, valor: pQ2, max: 20 },
          { nombre: &#x27;Evitar vencimientos&#x27;, valor: pVenc, max: 15 },
          { nombre: &#x27;Cierre diario (tiempo)&#x27;, valor: pCierre, max: 10 }
        ],
        q1: pendientes.filter(function (t) { return t.cuadrante === &#x27;hacer&#x27;; }).length,
        q2: enQ2,
        vencidas: vencidas,
        siguiente: rank.length &gt; 0 ? rank[0] : null
      };
    }

    // Desviación entre tiempo estimado y tiempo real (base del aprendizaje).
    function calcularDesviacion() {
      var conAmbos = state.tasks.filter(function (t) {
        return (Number(t.esfuerzo) || 0) &gt; 0 &amp;&amp; (Number(t.tiempoInvertidoSeg) || 0) &gt; 0;
      });
      if (conAmbos.length === 0) return null;
      var sumaEst = 0, sumaReal = 0;
      conAmbos.forEach(function (t) {
        sumaEst += Number(t.esfuerzo);
        sumaReal += (Number(t.tiempoInvertidoSeg) / 60);
      });
      if (sumaEst === 0) return null;
      var desv = Math.round(((sumaReal - sumaEst) / sumaEst) * 100);
      return { muestras: conAmbos.length, desviacion: desv };
    }

    // Anillo circular con el puntaje del Índice VÉRTICE.
    function verticeRing(valor, color) {
      var r = 42, circ = 2 * Math.PI * r;
      var pct = Math.max(0, Math.min(100, Number(valor) || 0));
      var avance = circ * (pct / 100);
      return &#x27;&lt;svg class=&quot;vRing&quot; viewBox=&quot;0 0 100 100&quot;&gt;&#x27; +
        &#x27;&lt;circle cx=&quot;50&quot; cy=&quot;50&quot; r=&quot;&#x27; + r + &#x27;&quot; fill=&quot;none&quot; stroke=&quot;#1A2530&quot; stroke-width=&quot;9&quot;/&gt;&#x27; +
        &#x27;&lt;circle cx=&quot;50&quot; cy=&quot;50&quot; r=&quot;&#x27; + r + &#x27;&quot; fill=&quot;none&quot; stroke=&quot;&#x27; + color + &#x27;&quot; stroke-width=&quot;9&quot; &#x27; +
          &#x27;stroke-linecap=&quot;round&quot; stroke-dasharray=&quot;&#x27; + avance + &#x27; &#x27; + circ + &#x27;&quot; &#x27; +
          &#x27;transform=&quot;rotate(-90 50 50)&quot;/&gt;&#x27; +
        &#x27;&lt;text x=&quot;50&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; fill=&quot;&#x27; + color + &#x27;&quot; &#x27; +
          &#x27;font-family=&quot;Space Grotesk, sans-serif&quot; font-size=&quot;26&quot; font-weight=&quot;700&quot;&gt;&#x27; + pct + &#x27;&lt;/text&gt;&#x27; +
        &#x27;&lt;/svg&gt;&#x27;;
    }

    function renderDashboard() {
      var todas = state.tasks;
      var completadas = todas.filter(function (t) { return t.estado === &#x27;Completada&#x27;; });
      var pendientes = todas.filter(function (t) { return t.estado !== &#x27;Completada&#x27;; });
      var total = todas.length;

      var cumplimiento = total &gt; 0 ? Math.round((completadas.length / total) * 100) : 0;

      var segTotal = 0;
      todas.forEach(function (t) { segTotal += Number(t.tiempoInvertidoSeg) || 0; });

      var vencidas = pendientes.filter(function (t) { return deadlineStatus(t) === &#x27;overdue&#x27;; }).length;
      var hoyVencen = pendientes.filter(function (t) { return deadlineStatus(t) === &#x27;today&#x27;; }).length;

      // Distribución por cuadrante
      var porCuadrante = { hacer: 0, planificar: 0, delegar: 0, eliminar: 0 };
      pendientes.forEach(function (t) {
        if (porCuadrante[t.cuadrante] !== undefined) porCuadrante[t.cuadrante]++;
      });

      // Distribución por calificación
      var porNota = { A: 0, B: 0, C: 0, D: 0 };
      pendientes.forEach(function (t) {
        if (porNota[t.calificacion] !== undefined) porNota[t.calificacion]++;
      });

      // Antigüedad promedio de lo pendiente
      var sumaDias = 0, conFecha = 0;
      pendientes.forEach(function (t) {
        var a = ageInfo(t);
        if (a) { sumaDias += a.dias; conFecha++; }
      });
      var promDias = conFecha &gt; 0 ? Math.round(sumaDias / conFecha) : 0;

      var html = &#x27;&lt;div class=&quot;dashWrap&quot;&gt;&#x27;;

      // ---- ÍNDICE VÉRTICE (lo primero que se ve) ----
      var idx = calcularIndiceVertice();
      html += &#x27;&lt;div class=&quot;verticeCard&quot; style=&quot;border-color:&#x27; + idx.color + &#x27;66;&quot;&gt;&#x27;;
      html += &#x27;&lt;div class=&quot;verticeTop&quot;&gt;&#x27;;
      html += &#x27;&lt;div&gt;&lt;div class=&quot;verticeLabel&quot;&gt;ÍNDICE VÉRTICE&lt;/div&gt;&#x27;;
      html += &#x27;&lt;div class=&quot;verticeScore&quot; style=&quot;color:&#x27; + idx.color + &#x27;;&quot;&gt;&#x27; + idx.total + &#x27;&lt;span class=&quot;verticeMax&quot;&gt;/100&lt;/span&gt;&lt;/div&gt;&#x27;;
      html += &#x27;&lt;div class=&quot;verticeTag&quot; style=&quot;color:&#x27; + idx.color + &#x27;;&quot;&gt;&#x27; + escapeHtml(idx.etiqueta) + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
      html += verticeRing(idx.total, idx.color);
      html += &#x27;&lt;/div&gt;&#x27;;
      html += &#x27;&lt;div class=&quot;verticeParts&quot;&gt;&#x27;;
      idx.partes.forEach(function (p) {
        var pct = p.max &gt; 0 ? (p.valor / p.max) * 100 : 0;
        html += &#x27;&lt;div class=&quot;vPart&quot;&gt;&#x27;;
        html += &#x27;&lt;div class=&quot;vPartTop&quot;&gt;&lt;span&gt;&#x27; + escapeHtml(p.nombre) + &#x27;&lt;/span&gt;&lt;b&gt;&#x27; + Math.round(p.valor) + &#x27;/&#x27; + p.max + &#x27;&lt;/b&gt;&lt;/div&gt;&#x27;;
        html += &#x27;&lt;div class=&quot;barOuter&quot;&gt;&lt;div class=&quot;barInner&quot; style=&quot;width:&#x27; + pct + &#x27;%; background:&#x27; + idx.color + &#x27;;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
        html += &#x27;&lt;/div&gt;&#x27;;
      });
      html += &#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;

      // ---- Siguiente acción sugerida ----
      if (idx.siguiente) {
        html += &#x27;&lt;div class=&quot;suggestCard&quot;&gt;&lt;div class=&quot;suggestLabel&quot;&gt;▶ Haz esta tarea primero&lt;/div&gt;&#x27;;
        html += &#x27;&lt;div class=&quot;suggestTitle&quot;&gt;&#x27; + escapeHtml(idx.siguiente.tarea) + &#x27;&lt;/div&gt;&#x27;;
        html += &#x27;&lt;div class=&quot;suggestMeta&quot;&gt;calificación &#x27; + idx.siguiente.calificacion + &#x27; · &#x27; + Math.round(idx.siguiente.puntaje) + &#x27;/100 · &#x27; + escapeHtml((QUADRANT_META[idx.siguiente.cuadrante] || {}).label || &#x27;&#x27;) + &#x27;&lt;/div&gt;&#x27;;
        html += &#x27;&lt;/div&gt;&#x27;;
      }

      // ---- Regla Q1 → Q2 ----
      if (idx.q1 &gt; 0) {
        html += &#x27;&lt;div class=&quot;ruleCard&quot;&gt;&lt;b&gt;Regla VÉRTICE:&lt;/b&gt; tienes &lt;b&gt;&#x27; + idx.q1 + &#x27;&lt;/b&gt; tarea&#x27; + (idx.q1 === 1 ? &#x27;&#x27; : &#x27;s&#x27;) + &#x27; en &lt;b&gt;Hacer ahora&lt;/b&gt; (Q1). Ponles fecha y bloque con anticipación para que la próxima vez lleguen como &lt;b&gt;Planificar&lt;/b&gt; (Q2), antes de volverse emergencia.&lt;/div&gt;&#x27;;
      } else {
        html += &#x27;&lt;div class=&quot;ruleCard ok&quot;&gt;&lt;b&gt;Regla VÉRTICE:&lt;/b&gt; nada en modo emergencia. Estás planificando antes de que se vuelva urgente.&lt;/div&gt;&#x27;;
      }

      html += &#x27;&lt;div class=&quot;kpiGrid&quot;&gt;&#x27;;
      html += kpiCard(&#x27;Cumplimiento&#x27;, cumplimiento + &#x27;%&#x27;, completadas.length + &#x27; de &#x27; + total + &#x27; tareas&#x27;, &#x27;#00D9A3&#x27;);
      html += kpiCard(&#x27;Tiempo enfocado&#x27;, fmtHoras(segTotal), &#x27;cronómetro acumulado&#x27;, &#x27;#5FD1FF&#x27;);
      html += kpiCard(&#x27;Completadas&#x27;, String(completadas.length), &#x27;en total&#x27;, &#x27;#00D9A3&#x27;);
      html += kpiCard(&#x27;Pendientes&#x27;, String(pendientes.length), vencidas + &#x27; vencidas · &#x27; + hoyVencen + &#x27; hoy&#x27;, vencidas &gt; 0 ? &#x27;#FF3B3B&#x27; : &#x27;#FFC145&#x27;);
      html += &#x27;&lt;/div&gt;&#x27;;

      // Barra de cumplimiento
      html += &#x27;&lt;div class=&quot;boxCard&quot;&gt;&lt;div class=&quot;boxTitle&quot;&gt;Progreso general&lt;/div&gt;&#x27;;
      html += &#x27;&lt;div class=&quot;progressOuter&quot;&gt;&lt;div class=&quot;progressInner&quot; style=&quot;width:&#x27; + cumplimiento + &#x27;%;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
      html += &#x27;&lt;div class=&quot;dashNote&quot;&gt;&#x27; + completadas.length + &#x27; completadas · &#x27; + pendientes.length + &#x27; en curso&lt;/div&gt;&lt;/div&gt;&#x27;;

      // Prioridades por cuadrante
      html += &#x27;&lt;div class=&quot;boxCard&quot;&gt;&lt;div class=&quot;boxTitle&quot;&gt;Prioridades · matriz de Eisenhower&lt;/div&gt;&#x27;;
      html += barRow(&#x27;Hacer ahora&#x27;, porCuadrante.hacer, pendientes.length, &#x27;#FF6B35&#x27;);
      html += barRow(&#x27;Planificar&#x27;, porCuadrante.planificar, pendientes.length, &#x27;#00D9A3&#x27;);
      html += barRow(&#x27;Delegar&#x27;, porCuadrante.delegar, pendientes.length, &#x27;#FFC145&#x27;);
      html += barRow(&#x27;Eliminar&#x27;, porCuadrante.eliminar, pendientes.length, &#x27;#6C7A89&#x27;);
      html += &#x27;&lt;/div&gt;&#x27;;

      // Calificaciones
      html += &#x27;&lt;div class=&quot;boxCard&quot;&gt;&lt;div class=&quot;boxTitle&quot;&gt;Distribución por calificación&lt;/div&gt;&#x27;;
      [&#x27;A&#x27;, &#x27;B&#x27;, &#x27;C&#x27;, &#x27;D&#x27;].forEach(function (n) {
        var colores = { A: &#x27;#00D9A3&#x27;, B: &#x27;#5FD1FF&#x27;, C: &#x27;#FFC145&#x27;, D: &#x27;#FF6B35&#x27; };
        html += barRow(&#x27;Nota &#x27; + n, porNota[n], pendientes.length, colores[n]);
      });
      html += &#x27;&lt;/div&gt;&#x27;;

      // Estadísticas varias
      html += &#x27;&lt;div class=&quot;boxCard&quot;&gt;&lt;div class=&quot;boxTitle&quot;&gt;Estadísticas&lt;/div&gt;&#x27;;
      html += statRow(&#x27;Antigüedad promedio de pendientes&#x27;, promDias + &#x27; días&#x27;);
      html += statRow(&#x27;Tareas vencidas&#x27;, String(vencidas));
      html += statRow(&#x27;Vencen hoy&#x27;, String(hoyVencen));
      html += statRow(&#x27;Bloques asignados en la semana&#x27;, String(state.assignments.length));
      html += statRow(&#x27;Tiempo enfocado total&#x27;, fmtHoras(segTotal));
      html += &#x27;&lt;/div&gt;&#x27;;

      // ---- Aprendizaje: estimado vs. real ----
      var desv = calcularDesviacion();
      html += &#x27;&lt;div class=&quot;boxCard&quot;&gt;&lt;div class=&quot;boxTitle&quot;&gt;Aprendizaje · estimación vs. realidad&lt;/div&gt;&#x27;;
      if (!desv) {
        html += &#x27;&lt;div class=&quot;dashNote&quot;&gt;Aún no hay datos suficientes. Usa el cronómetro (Iniciar/Pausar) en tus tareas y define su tiempo estimado; con varias semanas VÉRTICE podrá decirte si sueles subestimar o sobrestimar tu trabajo.&lt;/div&gt;&#x27;;
      } else if (desv.desviacion &gt; 5) {
        html += &#x27;&lt;div class=&quot;learnCard warn&quot;&gt;&lt;b&gt;Subestimas tu tiempo en ~&#x27; + desv.desviacion + &#x27;%.&lt;/b&gt;&lt;br&gt;&#x27; +
          &#x27;En promedio tardas más de lo que planeas. Al estimar, considera agregar ese margen.&lt;/div&gt;&#x27;;
        html += &#x27;&lt;div class=&quot;dashNote&quot;&gt;Basado en &#x27; + desv.muestras + &#x27; tarea&#x27; + (desv.muestras === 1 ? &#x27;&#x27; : &#x27;s&#x27;) + &#x27; con estimado y tiempo real registrado.&lt;/div&gt;&#x27;;
      } else if (desv.desviacion &lt; -5) {
        html += &#x27;&lt;div class=&quot;learnCard ok&quot;&gt;&lt;b&gt;Sobrestimas tu tiempo en ~&#x27; + Math.abs(desv.desviacion) + &#x27;%.&lt;/b&gt;&lt;br&gt;&#x27; +
          &#x27;Terminas antes de lo planeado: puedes agendar bloques más ajustados y caber más en el día.&lt;/div&gt;&#x27;;
        html += &#x27;&lt;div class=&quot;dashNote&quot;&gt;Basado en &#x27; + desv.muestras + &#x27; tarea&#x27; + (desv.muestras === 1 ? &#x27;&#x27; : &#x27;s&#x27;) + &#x27; con estimado y tiempo real registrado.&lt;/div&gt;&#x27;;
      } else {
        html += &#x27;&lt;div class=&quot;learnCard ok&quot;&gt;&lt;b&gt;Tus estimaciones son precisas&lt;/b&gt; (desviación &#x27; + desv.desviacion + &#x27;%).&lt;br&gt;&#x27; +
          &#x27;Planificas tu tiempo con buena exactitud.&lt;/div&gt;&#x27;;
        html += &#x27;&lt;div class=&quot;dashNote&quot;&gt;Basado en &#x27; + desv.muestras + &#x27; tarea&#x27; + (desv.muestras === 1 ? &#x27;&#x27; : &#x27;s&#x27;) + &#x27; con estimado y tiempo real registrado.&lt;/div&gt;&#x27;;
      }
      html += &#x27;&lt;/div&gt;&#x27;;

      html += &#x27;&lt;/div&gt;&#x27;;
      document.getElementById(&#x27;main&#x27;).innerHTML = html;
    }

    function kpiCard(titulo, valor, sub, color) {
      return &#x27;&lt;div class=&quot;kpiCard&quot; style=&quot;border-color:&#x27; + color + &#x27;55;&quot;&gt;&#x27; +
        &#x27;&lt;div class=&quot;kpiLabel&quot;&gt;&#x27; + escapeHtml(titulo) + &#x27;&lt;/div&gt;&#x27; +
        &#x27;&lt;div class=&quot;kpiValue&quot; style=&quot;color:&#x27; + color + &#x27;;&quot;&gt;&#x27; + escapeHtml(valor) + &#x27;&lt;/div&gt;&#x27; +
        &#x27;&lt;div class=&quot;kpiSub&quot;&gt;&#x27; + escapeHtml(sub) + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
    }
    function barRow(etiqueta, valor, total, color) {
      var pct = total &gt; 0 ? Math.round((valor / total) * 100) : 0;
      return &#x27;&lt;div class=&quot;barRow&quot;&gt;&lt;div class=&quot;barLabel&quot;&gt;&#x27; + escapeHtml(etiqueta) +
        &#x27;&lt;span class=&quot;barCount&quot;&gt;&#x27; + valor + &#x27;&lt;/span&gt;&lt;/div&gt;&#x27; +
        &#x27;&lt;div class=&quot;barOuter&quot;&gt;&lt;div class=&quot;barInner&quot; style=&quot;width:&#x27; + pct + &#x27;%; background:&#x27; + color + &#x27;;&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
    }
    function statRow(etiqueta, valor) {
      return &#x27;&lt;div class=&quot;statRow&quot;&gt;&lt;span&gt;&#x27; + escapeHtml(etiqueta) + &#x27;&lt;/span&gt;&lt;b&gt;&#x27; + escapeHtml(valor) + &#x27;&lt;/b&gt;&lt;/div&gt;&#x27;;
    }
    function fmtHoras(seg) {
      seg = Math.max(0, Math.floor(seg));
      var h = Math.floor(seg / 3600), m = Math.floor((seg % 3600) / 60);
      if (h === 0) return m + &#x27; min&#x27;;
      return h + &#x27;h &#x27; + pad(m) + &#x27;m&#x27;;
    }

    /* ===================== AJUSTES ===================== */
    function renderConfig() {
      var html = &#x27;&lt;div class=&quot;dashWrap&quot;&gt;&#x27;;

      // ---- Perfil ----
      html += &#x27;&lt;div class=&quot;boxCard&quot;&gt;&lt;div class=&quot;boxTitle&quot;&gt;Perfil&lt;/div&gt;&#x27;;
      html += statRow(&#x27;Usuario&#x27;, state.usuario || &#x27;sesión local&#x27;);
      html += statRow(&#x27;Aplicación&#x27;, &#x27;VÉRTICE · Productivity System&#x27;);
      html += &#x27;&lt;div class=&quot;dashNote&quot;&gt;Tu configuración se guarda con tu cuenta: al entrar desde otro dispositivo conservas tu horario y preferencias.&lt;/div&gt;&lt;/div&gt;&#x27;;

      // ---- Duración del bloque ----
      html += &#x27;&lt;div class=&quot;boxCard&quot;&gt;&lt;div class=&quot;boxTitle&quot;&gt;Duración del bloque&lt;/div&gt;&#x27;;
      html += &#x27;&lt;div class=&quot;cfgRow&quot;&gt;&lt;span&gt;Cada bloque dura&lt;/span&gt;&lt;div class=&quot;cfgChips&quot;&gt;&#x27;;
      [15, 30, 60].forEach(function (n) {
        html += &#x27;&lt;button class=&quot;cfgChip &#x27; + (state.slotMin === n ? &#x27;on&#x27; : &#x27;&#x27;) + &#x27;&quot; data-slot=&quot;&#x27; + n + &#x27;&quot;&gt;&#x27; + n + &#x27; min&lt;/button&gt;&#x27;;
      });
      html += &#x27;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;

      // ---- Horario laboral editable ----
      html += &#x27;&lt;div class=&quot;boxCard&quot;&gt;&lt;div class=&quot;boxTitle&quot;&gt;Mi horario&lt;/div&gt;&#x27;;
      html += &#x27;&lt;div class=&quot;dashNote&quot;&gt;Define a qué hora empiezas y terminas cada día, y tu pausa de almuerzo. Desmarca los días que no trabajas.&lt;/div&gt;&#x27;;
      state.dayNames.forEach(function (nombre, di) {
        var wins = state.workWindows[di] || [];
        var activo = wins.length &gt; 0;
        var ini = activo ? wins[0][0] : 8 * 60;
        var fin = activo ? wins[wins.length - 1][1] : 17 * 60;
        // Si el día tiene dos ventanas, el hueco entre ellas es la pausa.
        var hayPausa = wins.length &gt; 1;
        var pIni = hayPausa ? wins[0][1] : 12 * 60;
        var pFin = hayPausa ? wins[1][0] : 13 * 60 + 30;

        html += &#x27;&lt;div class=&quot;cfgDay&quot;&gt;&#x27;;
        html += &#x27;&lt;label class=&quot;cfgDayHead&quot;&gt;&lt;input type=&quot;checkbox&quot; class=&quot;checkbox&quot; data-dayon=&quot;&#x27; + di + &#x27;&quot; &#x27; + (activo ? &#x27;checked&#x27; : &#x27;&#x27;) + &#x27;&gt;&#x27; +
                &#x27;&lt;b&gt;&#x27; + nombre + &#x27;&lt;/b&gt;&lt;/label&gt;&#x27;;
        html += &#x27;&lt;div class=&quot;cfgTimes&#x27; + (activo ? &#x27;&#x27; : &#x27; off&#x27;) + &#x27;&quot;&gt;&#x27;;
        html += &#x27;&lt;input type=&quot;time&quot; class=&quot;cfgTime&quot; data-daystart=&quot;&#x27; + di + &#x27;&quot; value=&quot;&#x27; + hhmm(ini) + &#x27;&quot;&gt;&#x27;;
        html += &#x27;&lt;span class=&quot;cfgDash&quot;&gt;–&lt;/span&gt;&#x27;;
        html += &#x27;&lt;input type=&quot;time&quot; class=&quot;cfgTime&quot; data-dayend=&quot;&#x27; + di + &#x27;&quot; value=&quot;&#x27; + hhmm(fin) + &#x27;&quot;&gt;&#x27;;
        html += &#x27;&lt;/div&gt;&#x27;;
        html += &#x27;&lt;div class=&quot;cfgTimes cfgBreak&#x27; + (activo ? &#x27;&#x27; : &#x27; off&#x27;) + &#x27;&quot;&gt;&#x27;;
        html += &#x27;&lt;label class=&quot;cfgBreakLbl&quot;&gt;&lt;input type=&quot;checkbox&quot; class=&quot;checkbox&quot; data-breakon=&quot;&#x27; + di + &#x27;&quot; &#x27; + (hayPausa ? &#x27;checked&#x27; : &#x27;&#x27;) + &#x27;&gt;Almuerzo&lt;/label&gt;&#x27;;
        html += &#x27;&lt;input type=&quot;time&quot; class=&quot;cfgTime&quot; data-breakstart=&quot;&#x27; + di + &#x27;&quot; value=&quot;&#x27; + hhmm(pIni) + &#x27;&quot;&gt;&#x27;;
        html += &#x27;&lt;span class=&quot;cfgDash&quot;&gt;–&lt;/span&gt;&#x27;;
        html += &#x27;&lt;input type=&quot;time&quot; class=&quot;cfgTime&quot; data-breakend=&quot;&#x27; + di + &#x27;&quot; value=&quot;&#x27; + hhmm(pFin) + &#x27;&quot;&gt;&#x27;;
        html += &#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
      });
      html += &#x27;&lt;button class=&quot;cfgSave&quot; id=&quot;guardarHorario&quot;&gt;Guardar horario&lt;/button&gt;&lt;/div&gt;&#x27;;

      // ---- Reuniones habituales ----
      html += &#x27;&lt;div class=&quot;boxCard&quot;&gt;&lt;div class=&quot;boxTitle&quot;&gt;Mis reuniones habituales&lt;/div&gt;&#x27;;
      html += &#x27;&lt;div class=&quot;dashNote&quot;&gt;Se repiten todas las semanas y aparecen bloqueadas en el calendario (puedes agendar encima si hay una urgencia).&lt;/div&gt;&#x27;;
      if (!state.fixedEvents.length) html += &#x27;&lt;div class=&quot;emptyNote&quot;&gt;Aún no has agregado ninguna.&lt;/div&gt;&#x27;;
      state.fixedEvents.forEach(function (e, i) {
        html += &#x27;&lt;div class=&quot;cfgFixed&quot;&gt;&lt;div class=&quot;cfgFixedInfo&quot;&gt;&lt;b&gt;&#x27; + escapeHtml(e.label) + &#x27;&lt;/b&gt;&#x27; +
                &#x27;&lt;span&gt;&#x27; + state.dayNames[e.dia] + &#x27; · &#x27; + fmtMin(e.inicio) + &#x27;–&#x27; + fmtMin(e.fin) + &#x27;&lt;/span&gt;&lt;/div&gt;&#x27; +
                &#x27;&lt;button class=&quot;iconSmallBtn&quot; data-editfixed=&quot;&#x27; + i + &#x27;&quot;&gt;✏️&lt;/button&gt;&#x27; +
                &#x27;&lt;button class=&quot;iconSmallBtn&quot; data-delfixed=&quot;&#x27; + i + &#x27;&quot;&gt;✕&lt;/button&gt;&lt;/div&gt;&#x27;;
      });
      html += &#x27;&lt;button class=&quot;cfgAdd&quot; id=&quot;agregarReunion&quot;&gt;+ Agregar reunión habitual&lt;/button&gt;&lt;/div&gt;&#x27;;

      // ---- Notificaciones ----
      html += &#x27;&lt;div class=&quot;boxCard&quot;&gt;&lt;div class=&quot;boxTitle&quot;&gt;Notificaciones&lt;/div&gt;&#x27;;
      html += &#x27;&lt;div class=&quot;dashNote&quot;&gt;Las alertas de vencimiento (&lt;b&gt;Vencido&lt;/b&gt;, &lt;b&gt;Vence hoy&lt;/b&gt;, &lt;b&gt;Vence pronto&lt;/b&gt;) se muestran dentro de la app en Pendientes y Time Boxing.&lt;/div&gt;&#x27;;
      html += &#x27;&lt;div class=&quot;dashNote&quot;&gt;Para avisos en el celular con la app cerrada hace falta conectar Google Calendar o un correo diario — pídemelo y lo agrego.&lt;/div&gt;&lt;/div&gt;&#x27;;

      html += &#x27;&lt;/div&gt;&#x27;;
      document.getElementById(&#x27;main&#x27;).innerHTML = html;
      wireConfig();
    }

    function hhmm(min) { return pad(Math.floor(min / 60)) + &#x27;:&#x27; + pad(min % 60); }
    function minutosDe(txt) {
      var p = String(txt || &#x27;&#x27;).split(&#x27;:&#x27;);
      var h = Number(p[0]), m = Number(p[1]);
      if (!isFinite(h) || !isFinite(m)) return null;
      return h * 60 + m;
    }

    function wireConfig() {
      // Duración del bloque
      document.querySelectorAll(&#x27;[data-slot]&#x27;).forEach(function (el) {
        el.addEventListener(&#x27;click&#x27;, function () {
          var n = Number(el.getAttribute(&#x27;data-slot&#x27;));
          if (!confirm(&#x27;Cambiar la duración del bloque a &#x27; + n + &#x27; minutos?\n\nLos bloques ya agendados se recalcularán.&#x27;)) return;
          google.script.run.withSuccessHandler(onData).withFailureHandler(onError).guardarConfig(&#x27;slotMin&#x27;, n);
        });
      });

      // Activar/desactivar día
      document.querySelectorAll(&#x27;[data-dayon]&#x27;).forEach(function (el) {
        el.addEventListener(&#x27;change&#x27;, function () {
          var dia = el.closest(&#x27;.cfgDay&#x27;);
          if (!dia) return;
          dia.querySelectorAll(&#x27;.cfgTimes&#x27;).forEach(function (f) {
            var esBreak = f.classList.contains(&#x27;cfgBreak&#x27;);
            f.className = &#x27;cfgTimes&#x27; + (esBreak ? &#x27; cfgBreak&#x27; : &#x27;&#x27;) + (el.checked ? &#x27;&#x27; : &#x27; off&#x27;);
          });
        });
      });

      // Guardar horario completo
      var btn = document.getElementById(&#x27;guardarHorario&#x27;);
      if (btn) btn.addEventListener(&#x27;click&#x27;, function () {
        var nuevo = [];
        for (var di = 0; di &lt; state.dayNames.length; di++) {
          var chk = document.querySelector(&#x27;[data-dayon=&quot;&#x27; + di + &#x27;&quot;]&#x27;);
          if (!chk || !chk.checked) { nuevo.push([]); continue; }
          var ini = minutosDe(document.querySelector(&#x27;[data-daystart=&quot;&#x27; + di + &#x27;&quot;]&#x27;).value);
          var fin = minutosDe(document.querySelector(&#x27;[data-dayend=&quot;&#x27; + di + &#x27;&quot;]&#x27;).value);
          if (ini === null || fin === null || fin &lt;= ini) {
            alert(&#x27;Revisa el horario de &#x27; + state.dayNames[di] + &#x27;: la hora de fin debe ser mayor que la de inicio.&#x27;);
            return;
          }
          // Pausa de almuerzo: parte la jornada en dos tramos.
          var bChk = document.querySelector(&#x27;[data-breakon=&quot;&#x27; + di + &#x27;&quot;]&#x27;);
          if (bChk &amp;&amp; bChk.checked) {
            var bIni = minutosDe(document.querySelector(&#x27;[data-breakstart=&quot;&#x27; + di + &#x27;&quot;]&#x27;).value);
            var bFin = minutosDe(document.querySelector(&#x27;[data-breakend=&quot;&#x27; + di + &#x27;&quot;]&#x27;).value);
            if (bIni === null || bFin === null || bFin &lt;= bIni) {
              alert(&#x27;Revisa el almuerzo de &#x27; + state.dayNames[di] + &#x27;: la hora de fin debe ser mayor que la de inicio.&#x27;);
              return;
            }
            if (bIni &lt;= ini || bFin &gt;= fin) {
              alert(&#x27;El almuerzo de &#x27; + state.dayNames[di] + &#x27; debe quedar dentro de tu jornada.&#x27;);
              return;
            }
            nuevo.push([[ini, bIni], [bFin, fin]]);
          } else {
            nuevo.push([[ini, fin]]);
          }
        }
        btn.disabled = true; btn.textContent = &#x27;guardando…&#x27;;
        google.script.run.withSuccessHandler(function (d) {
          btn.disabled = false; btn.textContent = &#x27;Guardar horario&#x27;;
          onData(d);
        }).withFailureHandler(function (e) {
          btn.disabled = false; btn.textContent = &#x27;Guardar horario&#x27;;
          onError(e);
        }).guardarConfig(&#x27;workWindows&#x27;, nuevo);
      });

      // Agregar reunión habitual
      var addBtn = document.getElementById(&#x27;agregarReunion&#x27;);
      if (addBtn) addBtn.addEventListener(&#x27;click&#x27;, function () {
        var nombre = prompt(&#x27;Nombre de la reunión (ej. Comité semanal):&#x27;);
        if (!nombre) return;
        var opciones = state.dayNames.map(function (n, i) { return (i + 1) + &#x27; &#x27; + n; }).join(&#x27;  &#x27;);
        var diaTxt = prompt(&#x27;¿Qué día? Escribe el número:\n&#x27; + opciones);
        var dia = Number(diaTxt) - 1;
        if (!(dia &gt;= 0 &amp;&amp; dia &lt; state.dayNames.length)) { alert(&#x27;Día no válido.&#x27;); return; }
        var iniTxt = prompt(&#x27;Hora de inicio (formato 24h, ej. 14:00):&#x27;);
        var finTxt = prompt(&#x27;Hora de fin (formato 24h, ej. 15:30):&#x27;);
        var ini = minutosDe(iniTxt), fin = minutosDe(finTxt);
        if (ini === null || fin === null || fin &lt;= ini) { alert(&#x27;Horas no válidas.&#x27;); return; }
        var lista = (state.fixedEvents || []).slice();
        lista.push({ dia: dia, inicio: ini, fin: fin, label: String(nombre).trim() });
        google.script.run.withSuccessHandler(onData).withFailureHandler(onError).guardarConfig(&#x27;fixedEvents&#x27;, lista);
      });

      // Eliminar reunión
      // Editar una reunión habitual (nombre, día y horas)
      document.querySelectorAll(&#x27;[data-editfixed]&#x27;).forEach(function (el) {
        el.addEventListener(&#x27;click&#x27;, function () {
          var i = Number(el.getAttribute(&#x27;data-editfixed&#x27;));
          var lista = (state.fixedEvents || []).slice();
          var e = lista[i];
          if (!e) return;

          var nombre = prompt(&#x27;Nombre de la reunión:&#x27;, e.label);
          if (nombre === null) return;
          nombre = String(nombre).trim();
          if (!nombre) { alert(&#x27;El nombre no puede quedar vacío.&#x27;); return; }

          var opciones = state.dayNames.map(function (n, k) { return (k + 1) + &#x27; &#x27; + n; }).join(&#x27;  &#x27;);
          var diaTxt = prompt(&#x27;¿Qué día? Escribe el número:\n&#x27; + opciones, String(e.dia + 1));
          if (diaTxt === null) return;
          var dia = Number(diaTxt) - 1;
          if (!(dia &gt;= 0 &amp;&amp; dia &lt; state.dayNames.length)) { alert(&#x27;Día no válido.&#x27;); return; }

          var iniTxt = prompt(&#x27;Hora de inicio (24h):&#x27;, fmtMin(e.inicio));
          if (iniTxt === null) return;
          var finTxt = prompt(&#x27;Hora de fin (24h):&#x27;, fmtMin(e.fin));
          if (finTxt === null) return;
          var ini = minutosDe(iniTxt), fin = minutosDe(finTxt);
          if (ini === null || fin === null || fin &lt;= ini) { alert(&#x27;Horas no válidas.&#x27;); return; }

          lista[i] = { dia: dia, inicio: ini, fin: fin, label: nombre };
          google.script.run.withSuccessHandler(onData).withFailureHandler(onError)
            .guardarConfig(&#x27;fixedEvents&#x27;, lista);
        });
      });

      document.querySelectorAll(&#x27;[data-delfixed]&#x27;).forEach(function (el) {
        el.addEventListener(&#x27;click&#x27;, function () {
          var i = Number(el.getAttribute(&#x27;data-delfixed&#x27;));
          var lista = (state.fixedEvents || []).slice();
          if (!lista[i]) return;
          if (!confirm(&#x27;¿Eliminar &quot;&#x27; + lista[i].label + &#x27;&quot;?&#x27;)) return;
          lista.splice(i, 1);
          google.script.run.withSuccessHandler(onData).withFailureHandler(onError).guardarConfig(&#x27;fixedEvents&#x27;, lista);
        });
      });
    }

    function escapeHtml(s) { return String(s == null ? &#x27;&#x27; : s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, function (c) { return { &#x27;&amp;&#x27;: &#x27;&amp;amp;&#x27;, &#x27;&lt;&#x27;: &#x27;&amp;lt;&#x27;, &#x27;&gt;&#x27;: &#x27;&amp;gt;&#x27;, &#x27;&quot;&#x27;: &#x27;&amp;quot;&#x27;, &quot;&#x27;&quot;: &#x27;&amp;#39;&#x27; }[c]; }); }
    function escapeAttr(s) { return escapeHtml(s); }

    // Ajusta la barra de acciones antes de la primera carga, para que no
    // aparezca un botón que no corresponde a la pestaña inicial.
    actualizarBotonLista();
    // Service worker: permite instalarla y abrirla sin conexión.
    if (&#x27;serviceWorker&#x27; in navigator) {
      window.addEventListener(&#x27;load&#x27;, function () {
        navigator.serviceWorker.register(&#x27;sw.js&#x27;).catch(function () {});
      });
    }

    loadData();
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
</textarea>

  <script>
    var area = document.getElementById('codeArea');
    var btn = document.getElementById('copyBtn');

    function selectAll() {
      area.focus();
      area.select();
      area.setSelectionRange(0, area.value.length);
    }

    window.addEventListener('load', selectAll);

    btn.addEventListener('click', function () {
      selectAll();
      var copied = false;
      try {
        copied = document.execCommand('copy');
      } catch (e) { copied = false; }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(area.value).then(function () {
          btn.textContent = '✓ Copiado';
          btn.classList.add('copied');
          setTimeout(function () { btn.textContent = 'Seleccionar todo'; btn.classList.remove('copied'); }, 1800);
        }).catch(function () {
          btn.textContent = copied ? '✓ Copiado' : 'Seleccionado — usa Ctrl+C';
          if (copied) btn.classList.add('copied');
          setTimeout(function () { btn.textContent = 'Seleccionar todo'; btn.classList.remove('copied'); }, 2200);
        });
      } else {
        btn.textContent = copied ? '✓ Copiado' : 'Seleccionado — usa Ctrl+C';
        if (copied) btn.classList.add('copied');
        setTimeout(function () { btn.textContent = 'Seleccionar todo'; btn.classList.remove('copied'); }, 2200);
      }
    });
  </script>
