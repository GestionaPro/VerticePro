    @import url(&#x27;https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Inter:wght@400;500;600&amp;display=swap&#x27;);
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background:#0B0F14; color:#E8EDF2; font-family:&#x27;Inter&#x27;,sans-serif; min-height:100vh; display:flex; flex-direction:column;
      padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); padding-bottom:env(safe-area-inset-bottom);

    header { display:flex; justify-content:space-between; align-items:center; padding:16px 18px; border-bottom:1px solid #223142; position:sticky; top:0; background:#0B0F14; z-index:5; }

    nav { display:flex; align-items:center; gap:5px; padding:10px 12px; border-bottom:1px solid #223142; overflow-x:auto; position:sticky; top:70px; background:#0B0F14; z-index:4; }
    .navBtn { background:transparent; border:1px solid transparent; color:#6C7A89; font-family:&#x27;Space Grotesk&#x27;,sans-serif; font-size:17.5px; letter-spacing:.4px; padding:8px 10px; border-radius:6px; white-space:nowrap; cursor:pointer; flex:1; }

    main { padding:10px; max-width:100%; margin:0 auto; width:100%; flex:1 0 auto; }

    html, body { width:100%; overflow-x:hidden; overflow-y:auto; touch-action:manipulation; }
    .emptyNote { font-size:18.5px; color:#6C7A89; padding:8px 0; }

    /* Zona de desplazamiento del horario: con barra visible a la derecha,
       para poder bajar a las horas de la tarde también en horizontal. */
    .hourScroll { max-height:62vh; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-right:4px; }

    .subTabBtn.active { color:#00D9A3; border-color:#00D9A3; background:#0F251F; }

    &lt;button class=&quot;navBtn&quot; data-tab=&quot;completados&quot;&gt;COMPLETADOS&lt;/button&gt;
    &lt;button class=&quot;navBtn&quot; data-tab=&quot;dashboard&quot;&gt;DASHBOARD&lt;/button&gt;

  &lt;div class=&quot;actionRow&quot;&gt;
    &lt;button class=&quot;voiceBtn&quot; id=&quot;listViewBtn&quot; style=&quot;display:none;&quot;&gt;📋 Lista&lt;/button&gt;

    &lt;div class=&quot;field&quot; style=&quot;flex:1 1 220px;&quot;&gt;

    &lt;div class=&quot;field&quot;&gt;
      &lt;label&gt;Fecha límite&lt;/label&gt;
      &lt;input type=&quot;date&quot; class=&quot;dateInput&quot; id=&quot;fDeadline&quot;&gt;

      &lt;label&gt;Tiempo estimado&lt;/label&gt;
      &lt;input class=&quot;numInput&quot; id=&quot;fEst&quot; value=&quot;30 min&quot; title=&quot;Escribe 45, 1h, 1h 30 o 2h&quot; style=&quot;width:96px;&quot;&gt;
    &lt;/div&gt;
    &lt;div class=&quot;field&quot; style=&quot;flex:1 1 100%;&quot;&gt;
      &lt;label&gt;Planear en el calendario (opcional)&lt;/label&gt;
      &lt;div class=&quot;planNow&quot;&gt;
        &lt;select class=&quot;selInput&quot; id=&quot;fPlanSem&quot;&gt;
          &lt;option value=&quot;&quot;&gt;— sin agendar —&lt;/option&gt;
          &lt;option value=&quot;0&quot;&gt;Esta semana&lt;/option&gt;
          &lt;option value=&quot;1&quot;&gt;Semana siguiente&lt;/option&gt;
          &lt;option value=&quot;2&quot;&gt;En 2 semanas&lt;/option&gt;
        &lt;/select&gt;
        &lt;select class=&quot;selInput&quot; id=&quot;fPlanDia&quot;&gt;&lt;/select&gt;
        &lt;select class=&quot;selInput&quot; id=&quot;fPlanHora&quot;&gt;&lt;/select&gt;
      &lt;/div&gt;

    &lt;button class=&quot;confirmBtn&quot; id=&quot;fSubmit&quot;&gt;agregar&lt;/button&gt;
    &lt;button class=&quot;cancelBtn&quot; id=&quot;fCancel&quot;&gt;✕ cancelar&lt;/button&gt;
  &lt;/div&gt;

  &lt;main id=&quot;main&quot;&gt;&lt;div class=&quot;emptyNote&quot;&gt;Cargando…&lt;/div&gt;&lt;/main&gt;

  &lt;script&gt;
    var state = { tasks: [], assignments: [], workWindows: [], fixedEvents: [], dayNames: [], slotMin: 30, nowMs: Date.now() };
    var tab = &#x27;timeboxing&#x27;;
    var tbSub = &#x27;dia&#x27;; // &#x27;dia&#x27; | &#x27;semana&#x27;
    var selectedDayIndex = null; // se fija a hoy al cargar (o Lunes si es fin de semana)
    var selectedTaskId = null;
    var matrixSelectedId = null;
    var editingId = null;
    var listView = false; // false = tarjetas detalladas, true = lista compacta
    var verPrioridades = true; // mostrar u ocultar la lista de prioridades en Día
    var busquedaLista = &#x27;&#x27;; // texto del buscador en Pendientes / Completados
    var pickerCtx = null; // contexto del selector de tarea (día/slot)
    var weekOffset = 0;   // 0 = semana actual, 1 = siguiente, -1 = anterior
    var clientNow = new Date();
    var lastSyncOk = null;
    var lastError = null;
    var notesCache = {};
    var notesSaveTimer = null;

    function pad(n) { return String(n).padStart(2, &#x27;0&#x27;); }
    function fmtClock(d) { return pad(d.getHours()) + &#x27;:&#x27; + pad(d.getMinutes()) + &#x27;:&#x27; + pad(d.getSeconds()); }
    function fmtDuration(sec) {
      sec = Math.max(0, Math.floor(sec));
      var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
      if (h &gt; 0) return h + &#x27;h &#x27; + pad(m) + &#x27;m&#x27;;
      return pad(m) + &#x27;:&#x27; + pad(s);
    }
    function fmtMin(totalMin) { return pad(Math.floor(totalMin / 60)) + &#x27;:&#x27; + pad(totalMin % 60); }
    // Interpreta texto de duración: &quot;45&quot;, &quot;45 min&quot;, &quot;1h&quot;, &quot;1h 30&quot;, &quot;1:30&quot;, &quot;2h&quot;
    function parseDuracion(txt) {
      var s = String(txt || &#x27;&#x27;).toLowerCase().trim();
      if (!s) return null;
      var m;
      // formato 1:30
      m = s.match(/^(\d+)\s*:\s*(\d+)$/);
      if (m) return Math.max(10, Number(m[1]) * 60 + Number(m[2]));
      // formato 1h 30 / 1h30m / 1 h
      m = s.match(/^(\d+)\s*h\s*(\d+)?\s*m?$/);
      if (m) return Math.max(10, Number(m[1]) * 60 + (m[2] ? Number(m[2]) : 0));
      // formato 45 / 45 min / 45m
      m = s.match(/^(\d+)\s*(m|min|minutos)?$/);
      if (m) return Math.max(10, Number(m[1]));
      return null;
    }

    // Formatea minutos como &quot;30 min&quot; o &quot;1h 30m&quot;
    function fmtEstimado(min) {
      min = Number(min) || 0;
      if (min &lt; 60) return min + &#x27; min&#x27;;
      var h = Math.floor(min / 60), m = min % 60;
      return m === 0 ? (h + &#x27;h&#x27;) : (h + &#x27;h &#x27; + m + &#x27;m&#x27;);
    }

    function dateKey(d) { return d.getFullYear() + &#x27;-&#x27; + pad(d.getMonth() + 1) + &#x27;-&#x27; + pad(d.getDate()); }

    /* ---- MENSAJE DEL DÍA (ancla motivacional) ----
       Para cambiar las frases, edita esta lista. Rota sola: una por día,
       siempre la misma para una fecha dada. Puedes agregar las que quieras. */
    var FRASES_DEL_DIA = [
      &quot;Lo importante rara vez es urgente; hazlo antes de que lo sea.&quot;,
      &quot;Un bloque de tiempo protegido vale más que diez intenciones.&quot;,
      &quot;Empieza por lo difícil mientras tienes energía.&quot;,
      &quot;No estás atrasado: estás priorizando.&quot;,
      &quot;Hecho es mejor que perfecto.&quot;,
      &quot;Lo que se mide, se mejora.&quot;,
      &quot;Cada pendiente viejo pesa más que uno nuevo. Ciérralo.&quot;,
      &quot;El enfoque es decir que no a lo bueno para hacer lo esencial.&quot;,
      &quot;Avanza 1% hoy; en un año es otra persona.&quot;,
      &quot;Planear el día toma 5 minutos y devuelve horas.&quot;,
      &quot;La disciplina es recordar lo que quieres de verdad.&quot;,
      &quot;No confundas movimiento con progreso.&quot;,
      &quot;Termina lo empezado antes de abrir otro frente.&quot;,
      &quot;El tiempo no se encuentra: se asigna.&quot;,
      &quot;Haz el trabajo profundo temprano; lo demás puede esperar.&quot;,
      &quot;Una tarea sin fecha es solo un deseo.&quot;,
      &quot;Si todo es prioridad, nada lo es.&quot;,
      &quot;El mejor momento para hacerlo era ayer; el segundo mejor es ahora.&quot;,
      &quot;Descansar también es parte del plan.&quot;,
      &quot;Constancia le gana a intensidad.&quot;
    ];
    function fraseDelDia(fecha) {
      if (!FRASES_DEL_DIA.length) return &#x27;&#x27;;
      var inicioAnio = new Date(fecha.getFullYear(), 0, 0);
      var diaDelAnio = Math.floor((fecha - inicioAnio) / 86400000);
      return FRASES_DEL_DIA[diaDelAnio % FRASES_DEL_DIA.length];
    }

    // Estado de la fecha límite de un pendiente, para la alerta en rojo:
    // &#x27;overdue&#x27; = ya venció, &#x27;today&#x27; = vence hoy, &#x27;soon&#x27; = vence en 2 días o menos, null = sin alerta
    function deadlineStatus(t) {
      if (!t.fechaLimite) return null;
      var due = new Date(t.fechaLimite);
      if (isNaN(due.getTime())) return null;
      var todayStart = new Date(clientNow.getFullYear(), clientNow.getMonth(), clientNow.getDate());
      var dueDateOnly = new Date(due.getFullYear(), due.getMonth(), due.getDate());
      var diffDays = Math.round((dueDateOnly - todayStart) / 86400000);
      if (diffDays &lt; 0) return &#x27;overdue&#x27;;
      if (diffDays === 0) return &#x27;today&#x27;;
      if (diffDays &lt;= 2) return &#x27;soon&#x27;;
      return null;
    }
    // Antigüedad del pendiente: cuántos días/semanas lleva desde que se creó.
    function ageInfo(t) {
      if (!t.creadoEn) return null;
      var creado = new Date(t.creadoEn);
      if (isNaN(creado.getTime())) return null;
      var inicio = new Date(creado.getFullYear(), creado.getMonth(), creado.getDate());
      var hoy = new Date(clientNow.getFullYear(), clientNow.getMonth(), clientNow.getDate());
      var dias = Math.round((hoy - inicio) / 86400000);
      if (dias &lt; 0) dias = 0;
      var texto;
      if (dias === 0) texto = &#x27;hoy&#x27;;
      else if (dias === 1) texto = &#x27;1 día&#x27;;
      else if (dias &lt; 7) texto = dias + &#x27; días&#x27;;
      else {
        var semanas = Math.floor(dias / 7);
        var resto = dias % 7;
        texto = semanas + (semanas === 1 ? &#x27; sem&#x27; : &#x27; sem&#x27;);
        if (resto &gt; 0) texto += &#x27; &#x27; + resto + &#x27;d&#x27;;
        texto += &#x27; (&#x27; + dias + &#x27; días)&#x27;;
      }
      return { dias: dias, texto: texto };
    }
    function ageBadge(t) {
      var a = ageInfo(t);
      if (!a) return &#x27;&#x27;;
      var cls = &#x27;ageBadge&#x27;;
      if (a.dias &gt;= 30) cls += &#x27; ageOld&#x27;;
      else if (a.dias &gt;= 14) cls += &#x27; ageMid&#x27;;
      return &#x27;&lt;span class=&quot;&#x27; + cls + &#x27;&quot;&gt;⏳ &#x27; + escapeHtml(a.texto) + &#x27;&lt;/span&gt;&#x27;;
    }

    // Texto legible de una asignación: &quot;Vie 29 ago · 07:00&quot;
    function textoPlaneado(a) {
      var dia = state.dayNames[a.dia] || &#x27;&#x27;;
      var hora = fmtMin(a.horaMin);
      var sem = normSemana(a.semana);
      if (sem) {
        var p = sem.split(&#x27;-&#x27;);
        var lunes = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
        if (!isNaN(lunes.getTime())) {
          var fecha = new Date(lunes);
          fecha.setDate(fecha.getDate() + a.dia);
          return dia.slice(0, 3) + &#x27; &#x27; +
            fecha.toLocaleDateString(undefined, { day: &#x27;2-digit&#x27;, month: &#x27;short&#x27; }) +
            &#x27; · &#x27; + hora;
        }
      }
      return dia + &#x27; · &#x27; + hora;
    }

    // Fecha corta para la tabla: dd/mm
    function formatoFechaCorta(f) {
      var d = new Date(f);
      if (isNaN(d.getTime())) return String(f).slice(0, 10);
      return pad(d.getDate()) + &#x27;/&#x27; + pad(d.getMonth() + 1);
    }

    function deadlineBadge(t) {
      var st = deadlineStatus(t);
      if (st === &#x27;overdue&#x27;) return &#x27;&lt;span class=&quot;deadlineBadge overdue&quot;&gt;⚠️ Vencido&lt;/span&gt;&#x27;;
      if (st === &#x27;today&#x27;) return &#x27;&lt;span class=&quot;deadlineBadge today&quot;&gt;⚠️ Vence hoy&lt;/span&gt;&#x27;;
      if (st === &#x27;soon&#x27;) return &#x27;&lt;span class=&quot;deadlineBadge soon&quot;&gt;Vence pronto&lt;/span&gt;&#x27;;
      return &#x27;&#x27;;
    }

    setInterval(function () {
      clientNow = new Date();
      var clockEl = document.getElementById(&#x27;clock&#x27;);
      if (clockEl) clockEl.textContent = fmtClock(clientNow);
      if (tab === &#x27;timeboxing&#x27; &amp;&amp; !lastError &amp;&amp; state &amp;&amp; Array.isArray(state.tasks) &amp;&amp; Array.isArray(state.dayNames) &amp;&amp; state.dayNames.length &gt;= 5) {
        try { renderTimeBoxing(true); } catch (e) { renderUiCrash(e); }
      }
    }, 1000);

    /* -------- carga de datos -------- */
    var pingLog = [];
    function loadData() {
      // Diagnóstico temporal: primero probamos con una función que no toca
      // la hoja de cálculo, para aislar si el problema es del puente de
      // Apps Script en general o específico de getAppData()/Sheets.
      google.script.run.withSuccessHandler(function (pingResult) {
        pingLog.push({ t: fmtClock(new Date()), ok: !!(pingResult &amp;&amp; pingResult.ok), raw: pingResult });
        if (pingLog.length &gt; 10) pingLog.shift();
        google.script.run.withSuccessHandler(onData).withFailureHandler(onError).getAppData();
      }).withFailureHandler(function (err) {
        pingLog.push({ t: fmtClock(new Date()), ok: false, raw: &#x27;ERROR: &#x27; + (err &amp;&amp; err.message ? err.message : String(err)) });
        if (pingLog.length &gt; 10) pingLog.shift();
        google.script.run.withSuccessHandler(onData).withFailureHandler(onError).getAppData();
      }).ping();
    }
    var retryCount = 0;
    function onData(data) {
      // Blindaje: si el servidor devuelve vacío/incompleto en vez de lanzar
      // un error, lo tratamos como error en vez de dejar que la pantalla
      // se rompa leyendo propiedades de null/undefined.
      if (!data || typeof data !== &#x27;object&#x27; || !Array.isArray(data.tasks) || !Array.isArray(data.assignments) || !Array.isArray(data.workWindows) || !Array.isArray(data.dayNames) || data.dayNames.length &lt; 5) {
        // Diagnóstico: guardamos exactamente qué llegó, para verlo en el mensaje.
        var raw;
        try { raw = JSON.stringify(data); } catch (e2) { raw = String(data); }
        if (raw &amp;&amp; raw.length &gt; 400) raw = raw.slice(0, 400) + &#x27;…&#x27;;

        // Auto-reintento una vez: esto puede ser un fallo pasajero del lado
        // de Google (carga en frío, límite de llamadas simultáneas). Si el
        // reintento también falla, ahí sí mostramos el error persistente.
        if (retryCount &lt; 3) {
          retryCount++;
          var note1 = document.getElementById(&#x27;syncNote&#x27;);
          if (note1) note1.textContent = &#x27;reintentando (&#x27; + retryCount + &#x27;/3)…&#x27;;
          setTimeout(function () { loadData(); }, 700 * retryCount);
          return;
        }

        lastError = &#x27;El servidor devolvió una respuesta vacía o incompleta tras 3 reintentos. Dato crudo recibido: &#x27; + escapeHtml(raw === undefined ? &#x27;undefined&#x27; : (raw === &#x27;null&#x27; ? &#x27;null (literal)&#x27; : raw));
        var note0 = document.getElementById(&#x27;syncNote&#x27;);
        if (note0) note0.textContent = &#x27;error&#x27;;
        renderErrorBanner();
        return;
      }
      retryCount = 0;
      state = data;
      lastError = null;
      lastSyncOk = new Date();
      var note = document.getElementById(&#x27;syncNote&#x27;);
      if (note) note.textContent = &#x27;sync &#x27; + fmtClock(lastSyncOk);
      render();
    }
    function onError(err) {
      lastError = (err &amp;&amp; err.message) ? err.message : String(err);
      var note = document.getElementById(&#x27;syncNote&#x27;);
      if (note) note.textContent = &#x27;error&#x27;;
      renderErrorBanner();
    }
    function renderErrorBanner() {
      var html = &#x27;&lt;div class=&quot;errorNote&quot;&gt;No se pudo guardar/cargar: &lt;b&gt;&#x27; + escapeHtml(lastError) + &#x27;&lt;/b&gt;&#x27;;
      html += &#x27;&lt;br&gt;&lt;br&gt;Si acabas de pegar un cambio de código, ve a Implementar → Administrar implementaciones → editar (✏️) → Versión: Nueva versión → Implementar, para que la URL use el código actualizado.&#x27;;
      if (pingLog.length &gt; 0) {
        html += &#x27;&lt;br&gt;&lt;br&gt;&lt;b&gt;Registro de diagnóstico (ping):&lt;/b&gt;&lt;br&gt;&#x27;;
        pingLog.forEach(function (p) {
          var rawStr;
          try { rawStr = JSON.stringify(p.raw); } catch (e3) { rawStr = String(p.raw); }
          html += escapeHtml(p.t) + &#x27; — &#x27; + (p.ok ? &#x27;OK&#x27; : &#x27;FALLÓ&#x27;) + &#x27; — &#x27; + escapeHtml(rawStr) + &#x27;&lt;br&gt;&#x27;;
        });
      }
      html += &#x27;&lt;br&gt;&lt;button class=&quot;confirmBtn&quot; id=&quot;retryBtn&quot;&gt;Reintentar&lt;/button&gt;&lt;/div&gt;&#x27;;
      document.getElementById(&#x27;main&#x27;).innerHTML = html;
      var retryBtn = document.getElementById(&#x27;retryBtn&#x27;);
      if (retryBtn) retryBtn.addEventListener(&#x27;click&#x27;, function () {
        var note = document.getElementById(&#x27;syncNote&#x27;);
        if (note) note.textContent = &#x27;cargando…&#x27;;
        loadData();
      });
    }

    /* -------- navegación de pestañas -------- */
    document.querySelectorAll(&#x27;.navBtn&#x27;).forEach(function (btn) {
      btn.addEventListener(&#x27;click&#x27;, function () {
        tab = btn.getAttribute(&#x27;data-tab&#x27;);
        document.querySelectorAll(&#x27;.navBtn&#x27;).forEach(function (b) { b.classList.remove(&#x27;active&#x27;); });
        btn.classList.add(&#x27;active&#x27;);
        render();
      });
    });

    document.getElementById(&#x27;toggleForm&#x27;).addEventListener(&#x27;click&#x27;, function () {
      var bar = document.getElementById(&#x27;formBar&#x27;);
      var abriendo = (bar.style.display === &#x27;none&#x27;);
      bar.style.display = abriendo ? &#x27;flex&#x27; : &#x27;none&#x27;;
      if (abriendo) llenarSelectoresPlan();
    });

    // Llena los desplegables de día y hora del formulario, según tu horario.
    function llenarSelectoresPlan() {
      var selDia = document.getElementById(&#x27;fPlanDia&#x27;);
      var selHora = document.getElementById(&#x27;fPlanHora&#x27;);
      if (!selDia || !selHora || !state.dayNames) return;

      var activos = diasActivos();
      var hoy = nowDayIndex();
      var htmlDias = &#x27;&#x27;;
      activos.forEach(function (di) {
        htmlDias += &#x27;&lt;option value=&quot;&#x27; + di + &#x27;&quot;&#x27; + (di === hoy ? &#x27; selected&#x27; : &#x27;&#x27;) + &#x27;&gt;&#x27; +
                    state.dayNames[di] + &#x27;&lt;/option&gt;&#x27;;
      });
      selDia.innerHTML = htmlDias || &#x27;&lt;option value=&quot;&quot;&gt;sin días activos&lt;/option&gt;&#x27;;

      var r = rangoComun();
      var htmlHoras = &#x27;&#x27;;
      for (var m = r.inicio; m &lt; r.fin; m += state.slotMin) {
        htmlHoras += &#x27;&lt;option value=&quot;&#x27; + m + &#x27;&quot;&gt;&#x27; + fmtMin(m) + &#x27;&lt;/option&gt;&#x27;;
      }
      selHora.innerHTML = htmlHoras;

      // Los desplegables de día y hora solo sirven si eligió una semana.
      var selSem = document.getElementById(&#x27;fPlanSem&#x27;);
      function alternar() {
        var activo = selSem.value !== &#x27;&#x27;;
        selDia.disabled = !activo;
        selHora.disabled = !activo;
        selDia.style.opacity = activo ? &#x27;1&#x27; : &#x27;.4&#x27;;
        selHora.style.opacity = activo ? &#x27;1&#x27; : &#x27;.4&#x27;;
      }
      selSem.onchange = alternar;
      alternar();
    }
    // Alterna entre vista de tarjetas (detallada) y vista de lista compacta
    document.getElementById(&#x27;listViewBtn&#x27;).addEventListener(&#x27;click&#x27;, function () {
      listView = !listView;
      this.style.color = listView ? &#x27;#00D9A3&#x27; : &#x27;#FFC145&#x27;;
      this.style.borderColor = listView ? &#x27;#00D9A3&#x27; : &#x27;#FFC14566&#x27;;
      render();
    });

    // Visibilidad de los botones de la barra de acciones según la pestaña.
    // &quot;Lista&quot; solo en Pendientes; &quot;+ nuevo pendiente&quot; NO en Ajustes,
    // Dashboard ni Completados.
    function actualizarBotonLista() {
      var btn = document.getElementById(&#x27;listViewBtn&#x27;);
      if (btn) btn.style.display = (tab === &#x27;pendientes&#x27;) ? &#x27;&#x27; : &#x27;none&#x27;;

      var addBtn = document.getElementById(&#x27;toggleForm&#x27;);
      var sinCrear = (tab === &#x27;config&#x27; || tab === &#x27;dashboard&#x27; || tab === &#x27;completados&#x27;);
      if (addBtn) addBtn.style.display = sinCrear ? &#x27;none&#x27; : &#x27;&#x27;;
      if (sinCrear) {
        var bar = document.getElementById(&#x27;formBar&#x27;);
        if (bar) bar.style.display = &#x27;none&#x27;;
      }

    document.getElementById(&#x27;fImp&#x27;).addEventListener(&#x27;input&#x27;, function (e) {

    document.getElementById(&#x27;fCancel&#x27;).addEventListener(&#x27;click&#x27;, function () {
      document.getElementById(&#x27;fTitle&#x27;).value = &#x27;&#x27;;
      document.getElementById(&#x27;fDeadline&#x27;).value = &#x27;&#x27;;

    });
    document.getElementById(&#x27;fSubmit&#x27;).addEventListener(&#x27;click&#x27;, function () {
      var title = document.getElementById(&#x27;fTitle&#x27;).value.trim();
      if (!title) return;
      var btn = document.getElementById(&#x27;fSubmit&#x27;);

      var estimadoMin = parseDuracion(document.getElementById(&#x27;fEst&#x27;).value);
      if (estimadoMin === null) estimadoMin = 30;

      var payload = {
        tarea: title,

        fechaLimite: document.getElementById(&#x27;fDeadline&#x27;).value ? document.getElementById(&#x27;fDeadline&#x27;).value + &#x27;T18:00&#x27; : &#x27;&#x27;,
        esfuerzo: estimadoMin,
        recompensa: formReward
      };

      // Si eligió semana, la tarea queda agendada al crearla.
      var semSel = document.getElementById(&#x27;fPlanSem&#x27;).value;
      var planear = (semSel !== &#x27;&#x27;);
      var pDia = Number(document.getElementById(&#x27;fPlanDia&#x27;).value);
      var pHora = Number(document.getElementById(&#x27;fPlanHora&#x27;).value);
      var pClave = &#x27;&#x27;;
      if (planear) {
        if (esMomentoPasado(Number(semSel), pDia, pHora)) {
          alert(&#x27;Ese horario ya pasó. Elige un momento futuro.&#x27;);
          btn.disabled = false; btn.textContent = &#x27;agregar&#x27;;
          return;
        }
        var lunes = addDays(startOfWeek(clientNow), Number(semSel) * 7);
        pClave = lunes.getFullYear() + &#x27;-&#x27; + pad(lunes.getMonth() + 1) + &#x27;-&#x27; + pad(lunes.getDate());
      }

      google.script.run.withSuccessHandler(function (data) {
        document.getElementById(&#x27;fTitle&#x27;).value = &#x27;&#x27;;
        document.getElementById(&#x27;fDeadline&#x27;).value = &#x27;&#x27;;
        document.getElementById(&#x27;fEst&#x27;).value = &#x27;30 min&#x27;;
        document.getElementById(&#x27;fPlanSem&#x27;).value = &#x27;&#x27;;
        document.getElementById(&#x27;formBar&#x27;).style.display = &#x27;none&#x27;;
        btn.disabled = false; btn.textContent = &#x27;agregar&#x27;;

        if (planear) {
          // Buscar la tarea recién creada y agendarla en el horario elegido.
          var creada = null;
          (data.tasks || []).forEach(function (t) {
            if (t.tarea === title &amp;&amp; (!creada || String(t.id) &gt; String(creada.id))) creada = t;
          });
          if (creada) {
            google.script.run.withSuccessHandler(onData).withFailureHandler(onError)
              .assignBlock(pDia, pHora, creada.id, pClave);
            return;
          }
        }
        onData(data);
      }).withFailureHandler(function (err) {
        btn.disabled = false; btn.textContent = &#x27;agregar&#x27;;
        onError(err);
      }).addTask(payload);
    });

    function render() {
      try {
        actualizarBotonLista();
        var bp = document.getElementById(&#x27;brandPhrase&#x27;);
        if (bp) bp.textContent = fraseDelDia(clientNow);
        if (lastError) { renderErrorBanner(); return; }
        if (!state || !Array.isArray(state.tasks) || !Array.isArray(state.assignments) || !Array.isArray(state.workWindows) || !Array.isArray(state.dayNames) || state.dayNames.length &lt; 5) {
          document.getElementById(&#x27;main&#x27;).innerHTML = &#x27;&lt;div class=&quot;emptyNote&quot;&gt;Cargando…&lt;/div&gt;&#x27;;
          return;
        }
        if (tab === &#x27;timeboxing&#x27;) renderTimeBoxing();
        else if (tab === &#x27;matriz&#x27;) renderMatriz();
        else if (tab === &#x27;pendientes&#x27;) renderLista(false);
        else if (tab === &#x27;completados&#x27;) renderLista(true);
        else if (tab === &#x27;dashboard&#x27;) renderDashboard();
        else if (tab === &#x27;config&#x27;) renderConfig();
        else renderLista(true);
      } catch (e) {
        renderUiCrash(e);
      }
    }

    function renderUiCrash(e) {
      var msg = (e &amp;&amp; e.message) ? e.message : String(e);
      var loc = &#x27;&#x27;;
      if (e &amp;&amp; e.stack) {
        var firstLine = String(e.stack).split(&#x27;\n&#x27;)[0];
        loc = firstLine;
      }
      document.getElementById(&#x27;main&#x27;).innerHTML =
        &#x27;&lt;div class=&quot;errorNote&quot;&gt;Error al armar la pantalla: &lt;b&gt;&#x27; + escapeHtml(msg) + &#x27;&lt;/b&gt;&#x27; +
        (loc ? &#x27;&lt;br&gt;&lt;br&gt;&#x27; + escapeHtml(loc) : &#x27;&#x27;) +
        &#x27;&lt;br&gt;&lt;br&gt;Manda una captura de este mensaje.&lt;/div&gt;&#x27;;
    }

    /* ===================== HELPERS COMUNES ===================== */
    function startOfWeek(d) {
      var date = new Date(d);
      var day = date.getDay();
      var diff = (day === 0 ? -6 : 1) - day;
      date.setDate(date.getDate() + diff);
      date.setHours(0, 0, 0, 0);
      return date;
    }
    function addDays(d, n) { var r = new Date(d); r.setDate(r.getDate() + n); return r; }
    function taskById(id) { return state.tasks.find(function (t) { return t.id === id; }); }

    // Genera la lista de espacios (slots) de un día a partir de sus ventanas laborales reales
    // Rango horario común: desde la hora más temprana hasta la más tardía
    // de toda la semana. Así el viernes (jornada corta) se ve completo y no
    // se pasa de semana tan rápido; las horas no laborables salen rayadas.
    function rangoComun() {
      var min = null, max = null;
      (state.workWindows || []).forEach(function (wins) {
        (wins || []).forEach(function (w) {
          if (min === null || w[0] &lt; min) min = w[0];
          if (max === null || w[1] &gt; max) max = w[1];
        });
      });
      // El rango sale de TU horario en Ajustes: desde la hora más temprana
      // hasta la más tardía de la semana. Todos los días se dibujan con ese
      // mismo rango, así ninguno queda más corto que los demás.
      if (min === null) min = 8 * 60;
      if (max === null) max = 18 * 60;
      return { inicio: Math.floor(min / 60) * 60, fin: Math.ceil(max / 60) * 60 };
    }
    // Todas las horas del rango común (se dibujan siempre, aunque el día no
    // trabaje a esa hora).
    function horasComunes() {
      var r = rangoComun(), horas = [];
      for (var h = Math.floor(r.inicio / 60); h &lt; Math.ceil(r.fin / 60); h++) horas.push(h);
      return horas;
    }

    // Días activos según lo configurado en Ajustes (los que tienen horario).
    function diasActivos() {
      var lista = [];
      (state.dayNames || []).forEach(function (n, i) {
        if (daySlots(i).length &gt; 0) lista.push(i);
      });
      return lista;
    }
    // Siguiente/anterior día activo, saltando los desactivados.
    function moverDia(desde, paso) {
      var act = diasActivos();
      if (act.length === 0) return desde;
      var pos = act.indexOf(desde);
      if (pos === -1) return act[0];
      return act[(pos + paso + act.length) % act.length];
    }

    function daySlots(dayIdx) {
      var wins = state.workWindows[dayIdx] || [];
      var slots = [];
      wins.forEach(function (w) {
        for (var m = w[0]; m &lt; w[1]; m += state.slotMin) slots.push(m);
      });
      return slots;
    }
    function getFixedEvent(dayIdx, slotMin) {
      for (var i = 0; i &lt; state.fixedEvents.length; i++) {
        var e = state.fixedEvents[i];
        if (e.dia === dayIdx &amp;&amp; slotMin &gt;= e.inicio &amp;&amp; slotMin &lt; e.fin) return e;
      }
      return null;
    }

    // Cuántos bloques ocupa una tarea segun su duracion estimada (min 1).
    function blocksFor(t) {
      var min = Number(t &amp;&amp; t.esfuerzo) || state.slotMin;
      var n = Math.ceil(min / state.slotMin);
      return Math.max(1, n);
    }

    // Momento &quot;ahora&quot; en clave dia/minuto. Devuelve -1 en fin de semana.
    function nowDayIndex() {
      var d = clientNow.getDay();
      return (d === 0) ? 6 : d - 1;   // 0=Lunes .. 5=Sábado, 6=Domingo
    }
    function nowMinutes() {
      return clientNow.getHours() * 60 + clientNow.getMinutes();
    }
    // ¿Ese momento (semana relativa, día, hora) ya pasó?
    function esMomentoPasado(offsetSemana, dayIdx, slotMin) {
      if (offsetSemana &gt; 0) return false;
      if (offsetSemana &lt; 0) return true;
      var hoy = nowDayIndex();
      if (dayIdx &lt; hoy) return true;
      if (dayIdx &gt; hoy) return false;
      return slotMin &lt;= nowMinutes();
    }

    // Un slot es &quot;pasado&quot; si su dia ya pasó, o si es hoy y su hora ya empezó.
    function slotEsPasado(dayIdx, slotMin) {
      // Semanas futuras: nada es pasado. Semanas anteriores: todo lo es.
      if (weekOffset &gt; 0) return false;
      if (weekOffset &lt; 0) return true;

      var hoy = nowDayIndex();
      if (hoy === -1) return false;      // fin de semana: no bloqueamos nada
      if (dayIdx &lt; hoy) return true;     // dias anteriores de esta semana
      if (dayIdx &gt; hoy) return false;    // dias futuros
      // Hoy: el bloque en curso también cuenta como pasado, porque ya no
      // se puede empezar una tarea al inicio de esa franja.
      return slotMin &lt;= nowMinutes();
    }

    // Mapa de ocupacion REAL: cada asignacion ocupa tantos slots como su duracion.
    // Devuelve &quot;dia-slot&quot; -&gt; { asig, task, inicio:true|false }
    // Lunes de la semana que se está viendo (según weekOffset).
    function weekStartActual() {
      return addDays(startOfWeek(clientNow), weekOffset * 7);
    }
    // Normaliza cualquier formato de semana a &quot;YYYY-MM-DD&quot;.
    function normSemana(v) {
      if (!v) return &#x27;&#x27;;
      return String(v).slice(0, 10);
    }

    // Clave &quot;YYYY-MM-DD&quot; del lunes de la semana visible.
    function claveSemana() {
      var d = weekStartActual();
      return d.getFullYear() + &#x27;-&#x27; + pad(d.getMonth() + 1) + &#x27;-&#x27; + pad(d.getDate());
    }
    // Solo las asignaciones de la semana que se está viendo.
    function asignacionesVisibles() {
      var clave = claveSemana();
      return (state.assignments || []).filter(function (a) {
        return !a.semana || normSemana(a.semana) === clave;
      });
    }

    // Devuelve los slots que realmente ocupará una tarea de n bloques que
    // empieza en slotMin, SALTÁNDOSE las horas no laborables (almuerzo).
    // Ej.: 2h que empieza 11:00 con almuerzo 12:00-13:30 ocupa
    // 11:00, 11:30, 13:30 y 14:00.
    function slotsOcupados(dayIdx, slotMin, n) {
      var disponibles = daySlots(dayIdx);
      var desde = disponibles.indexOf(slotMin);
      if (desde === -1) {
        // Si el inicio no es laborable (p. ej. encima de una reunión),
        // se ocupan bloques consecutivos sin saltar.
        var seguidos = [];
        for (var j = 0; j &lt; n; j++) seguidos.push(slotMin + j * state.slotMin);
        return seguidos;
      }
      return disponibles.slice(desde, desde + n);
    }

    function buildOccupancy() {
      var occ = {};
      asignacionesVisibles().forEach(function (a) {
        var t = taskById(a.idTarea);
        var n = blocksFor(t);
        var slots = slotsOcupados(a.dia, a.horaMin, n);
        slots.forEach(function (slot, k) {
          occ[a.dia + &#x27;-&#x27; + slot] = { asig: a, task: t, inicio: (k === 0), total: slots.length, indice: k };
        });
      });
      return occ;
    }

    // ¿Caben n bloques consecutivos empezando en este slot? (mismo dia, sin
    // pisar fijos ni otras asignaciones, y dentro del horario laboral)
    function cabenBloques(dayIdx, slotMin, n, occ) {
      // Se usan los slots reales (saltando almuerzo). Si no alcanzan hasta
      // el final de la jornada, la tarea no cabe.
      var usados = slotsOcupados(dayIdx, slotMin, n);
      if (usados.length &lt; n) return false;
      var disponibles = daySlots(dayIdx);
      for (var k = 0; k &lt; usados.length; k++) {
        var s = usados[k];
        if (disponibles.indexOf(s) === -1) return false;
        if (getFixedEvent(dayIdx, s)) return false;
        if (occ[dayIdx + &#x27;-&#x27; + s]) return false;
      }
      return true;
    }

    function cellContent(dayIdx, slotMin, occ) {
      var o = occ[dayIdx + &#x27;-&#x27; + slotMin];
      if (o) {
        return { type: &#x27;real&#x27;, task: o.task, blockId: o.asig.id,
                 inicio: o.inicio, total: o.total, indice: o.indice };
      }
      var fixed = getFixedEvent(dayIdx, slotMin);
      if (fixed) return { type: &#x27;fixed&#x27;, label: fixed.label };
      return { type: &#x27;empty&#x27;, pasado: slotEsPasado(dayIdx, slotMin) };
    }

    function handleCellClick(dayIdx, slotMin, info) {
      // Bloque ya ocupado por una tarea: ofrecer quitarla.
      if (info.type === &#x27;real&#x27;) {
        if (confirm(&#x27;¿Quitar &quot;&#x27; + (info.task ? info.task.tarea : &#x27;&#x27;) + &#x27;&quot; de este horario?&#x27;)) {
          google.script.run.withSuccessHandler(onData).withFailureHandler(onError).removeAssignment(info.blockId);
        }
        return;
      }

      // Compromiso fijo (reunión, campo...). Se puede sobrescribir si hay
      // una urgencia que obliga a usar ese horario.
      if (info.type === &#x27;fixed&#x27;) {
        abrirMenuCompromiso(dayIdx, slotMin, info);
        return;
      }

      if (info.type === &#x27;empty&#x27;) {
        if (info.pasado) return;
        abrirSelectorDeTarea(dayIdx, slotMin, false);
      }
    }

    // Menú al tocar un compromiso fijo (reunión, campo...):
    // permite usar el horario igual, cancelar esa ocurrencia o aplazarla.
    function abrirMenuCompromiso(dayIdx, slotMin, info) {
      // Buscar el compromiso completo (no solo el bloque tocado), para poder
      // cancelarlo o aplazarlo entero. Antes solo se cancelaba un bloque y
      // por eso la reunión seguía apareciendo en el día.
      var comp = null;
      (state.fixedEvents || []).forEach(function (e) {
        if (e.dia === dayIdx &amp;&amp; slotMin &gt;= e.inicio &amp;&amp; slotMin &lt; e.fin &amp;&amp; e.label === info.label) comp = e;
      });
      var ini = comp ? comp.inicio : slotMin;
      var fin = comp ? comp.fin : (slotMin + state.slotMin);

      // Todas las claves que cubre ese compromiso.
      var clavesOcurrencia = [];
      for (var mm = ini; mm &lt; fin; mm += state.slotMin) {
        clavesOcurrencia.push(dayIdx + &#x27;-&#x27; + mm + &#x27;-&#x27; + info.label);
      }

      var html = &#x27;&lt;div class=&quot;pickerBackdrop&quot; id=&quot;pickerBackdrop&quot;&gt;&lt;div class=&quot;pickerBox&quot;&gt;&#x27;;
      html += &#x27;&lt;div class=&quot;pickerHead&quot;&gt;🔒 &#x27; + escapeHtml(info.label) +
              &#x27;&lt;div class=&quot;pickerWhen&quot;&gt;&#x27; + state.dayNames[dayIdx] + &#x27; · &#x27; + fmtMin(slotMin) + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
      html += &#x27;&lt;div class=&quot;pickerSub&quot;&gt;Este horario está reservado. ¿Qué quieres hacer?&lt;/div&gt;&#x27;;

      html += &#x27;&lt;button class=&quot;pickerOpt&quot; id=&quot;optUsar&quot;&gt;&lt;b&gt;Agendar una tarea aquí igual&lt;/b&gt;&#x27; +
              &#x27;&lt;span&gt;La reunión sigue en pie, pero ocupas el bloque&lt;/span&gt;&lt;/button&gt;&#x27;;
      html += &#x27;&lt;button class=&quot;pickerOpt&quot; id=&quot;optCancelar&quot;&gt;&lt;b&gt;Cancelar esta ocurrencia&lt;/b&gt;&#x27; +
              &#x27;&lt;span&gt;Solo por esta semana; libera el horario&lt;/span&gt;&lt;/button&gt;&#x27;;
      html += &#x27;&lt;button class=&quot;pickerOpt&quot; id=&quot;optAplazar&quot;&gt;&lt;b&gt;Aplazar esta ocurrencia&lt;/b&gt;&#x27; +
              &#x27;&lt;span&gt;Mover a otra hora del mismo día&lt;/span&gt;&lt;/button&gt;&#x27;;

      html += &#x27;&lt;button class=&quot;pickerCancel&quot; id=&quot;pickerCancelar&quot;&gt;Cerrar&lt;/button&gt;&#x27;;
      html += &#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;

      var cont = document.createElement(&#x27;div&#x27;);
      cont.innerHTML = html;
      document.body.appendChild(cont.firstChild);

      document.getElementById(&#x27;pickerCancelar&#x27;).addEventListener(&#x27;click&#x27;, cerrarSelector);
      document.getElementById(&#x27;pickerBackdrop&#x27;).addEventListener(&#x27;click&#x27;, function (ev) {
        if (ev.target &amp;&amp; ev.target.id === &#x27;pickerBackdrop&#x27;) cerrarSelector();
      });

      document.getElementById(&#x27;optUsar&#x27;).addEventListener(&#x27;click&#x27;, function () {
        cerrarSelector();
        abrirSelectorDeTarea(dayIdx, slotMin, true);
      });

      document.getElementById(&#x27;optCancelar&#x27;).addEventListener(&#x27;click&#x27;, function () {
        if (!confirm(&#x27;¿Cancelar &quot;&#x27; + info.label + &#x27;&quot; solo esta semana?&#x27;)) return;
        var canc = (state.config &amp;&amp; state.config.canceladas) ? state.config.canceladas.slice() : [];
        clavesOcurrencia.forEach(function (k) { if (canc.indexOf(k) === -1) canc.push(k); });
        cerrarSelector();
        google.script.run.withSuccessHandler(onData).withFailureHandler(onError)
          .guardarConfig(&#x27;canceladas&#x27;, canc);
      });

      document.getElementById(&#x27;optAplazar&#x27;).addEventListener(&#x27;click&#x27;, function () {
        var nuevaHora = prompt(&#x27;¿A qué hora mover &quot;&#x27; + info.label + &#x27;&quot;? (formato 24h, ej. 16:00)&#x27;);
        if (!nuevaHora) return;
        var min = minutosDe(nuevaHora);
        if (min === null) { alert(&#x27;Hora no válida.&#x27;); return; }

        // Se cancela esta ocurrencia y se crea una excepción en la nueva hora.
        var canc = (state.config &amp;&amp; state.config.canceladas) ? state.config.canceladas.slice() : [];
        clavesOcurrencia.forEach(function (k) { if (canc.indexOf(k) === -1) canc.push(k); });

        var extras = (state.config &amp;&amp; state.config.extras) ? state.config.extras.slice() : [];
        var duracion = fin - ini;
        extras.push({ dia: dayIdx, inicio: min, fin: min + duracion, label: info.label });

        cerrarSelector();
        google.script.run.withSuccessHandler(function () {
          google.script.run.withSuccessHandler(onData).withFailureHandler(onError)
            .guardarConfig(&#x27;extras&#x27;, extras);
        }).withFailureHandler(onError).guardarConfig(&#x27;canceladas&#x27;, canc);
      });
    }

    // Selector: elegir cualquiera de tus pendientes (ordenados por prioridad) o crear uno nuevo.
    function abrirSelectorDeTarea(dayIdx, slotMin, forzar) {
      pickerCtx = { dia: dayIdx, slot: slotMin, forzar: !!forzar };

      var candidatos = state.tasks.filter(function (t) {
        return t.estado !== &#x27;Completada&#x27; &amp;&amp; !state.assignments.some(function (a) { return a.idTarea === t.id; });
      }).sort(function (a, b) { return b.puntaje - a.puntaje; });

      var html = &#x27;&lt;div class=&quot;pickerBackdrop&quot; id=&quot;pickerBackdrop&quot;&gt;&lt;div class=&quot;pickerBox&quot;&gt;&#x27;;
      html += &#x27;&lt;div class=&quot;pickerHead&quot;&gt;&#x27; + state.dayNames[dayIdx] + &#x27; · &#x27; + fmtMin(slotMin) +
              (forzar ? &#x27; &lt;span class=&quot;forceTag&quot;&gt;sobre compromiso fijo&lt;/span&gt;&#x27; : &#x27;&#x27;) + &#x27;&lt;/div&gt;&#x27;;
      html += &#x27;&lt;button class=&quot;pickerNew&quot; id=&quot;pickerNuevo&quot;&gt;+ Crear pendiente nuevo aquí&lt;/button&gt;&#x27;;
      html += &#x27;&lt;div class=&quot;pickerSub&quot;&gt;O asignar uno de tus pendientes (&#x27; + candidatos.length + &#x27;):&lt;/div&gt;&#x27;;
      html += &#x27;&lt;input class=&quot;pickerSearch&quot; id=&quot;pickerBuscar&quot; placeholder=&quot;🔍 Buscar pendiente…&quot;&gt;&#x27;;
      html += &#x27;&lt;div class=&quot;pickerLista&quot; id=&quot;pickerLista&quot;&gt;&#x27;;

      if (candidatos.length === 0) {
        html += &#x27;&lt;div class=&quot;emptyNote&quot;&gt;No hay pendientes sin horario.&lt;/div&gt;&#x27;;
      }
      candidatos.forEach(function (t, i) {
        var dur = fmtEstimado(Number(t.esfuerzo) || state.slotMin);
        html += &#x27;&lt;button class=&quot;pickerItem&quot; data-pick=&quot;&#x27; + t.id + &#x27;&quot;&gt;&#x27; +
          &#x27;&lt;span class=&quot;pickerRank&quot;&gt;&#x27; + (i + 1) + &#x27;&lt;/span&gt;&#x27; +
          &#x27;&lt;span class=&quot;pickerName&quot;&gt;&#x27; + escapeHtml(t.tarea) + &#x27;&lt;/span&gt;&#x27; +
          &#x27;&lt;span class=&quot;gradeBadge&quot; style=&quot;&#x27; + gradeColorCss(t.calificacion) + &#x27;&quot;&gt;&#x27; + t.calificacion + &#x27;&lt;/span&gt;&#x27; +
          &#x27;&lt;span class=&quot;pickerDur&quot;&gt;&#x27; + dur + &#x27;&lt;/span&gt;&lt;/button&gt;&#x27;;
      });

      html += &#x27;&lt;/div&gt;&#x27;;
      html += &#x27;&lt;button class=&quot;pickerCancel&quot; id=&quot;pickerCancelar&quot;&gt;Cancelar&lt;/button&gt;&#x27;;
      html += &#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;

      var cont = document.createElement(&#x27;div&#x27;);
      cont.innerHTML = html;
      document.body.appendChild(cont.firstChild);

      // Buscador dentro del selector
      var buscar = document.getElementById(&#x27;pickerBuscar&#x27;);
      if (buscar) buscar.addEventListener(&#x27;input&#x27;, function () {
        var q = buscar.value.toLowerCase().trim();
        document.querySelectorAll(&#x27;#pickerLista [data-pick]&#x27;).forEach(function (b) {
          var txt = (b.textContent || &#x27;&#x27;).toLowerCase();
          b.style.display = (!q || txt.indexOf(q) !== -1) ? &#x27;&#x27; : &#x27;none&#x27;;
        });
      });

      document.getElementById(&#x27;pickerCancelar&#x27;).addEventListener(&#x27;click&#x27;, cerrarSelector);
      document.getElementById(&#x27;pickerBackdrop&#x27;).addEventListener(&#x27;click&#x27;, function (ev) {
        if (ev.target &amp;&amp; ev.target.id === &#x27;pickerBackdrop&#x27;) cerrarSelector();
      });
      document.getElementById(&#x27;pickerNuevo&#x27;).addEventListener(&#x27;click&#x27;, function () {
        cerrarSelector();
        crearPendienteEnBloque(pickerCtx.dia, pickerCtx.slot);
      });
      document.querySelectorAll(&#x27;[data-pick]&#x27;).forEach(function (el) {
        el.addEventListener(&#x27;click&#x27;, function () {
          var id = el.getAttribute(&#x27;data-pick&#x27;);
          var t = taskById(id);
          var occ = buildOccupancy();
          if (!pickerCtx.forzar &amp;&amp; !cabenBloques(pickerCtx.dia, pickerCtx.slot, blocksFor(t), occ)) {
            alert(&#x27;No cabe aquí: &quot;&#x27; + t.tarea + &#x27;&quot; dura &#x27; + fmtEstimado(Number(t.esfuerzo) || state.slotMin) +
                  &#x27; y ese espacio está ocupado o fuera del horario.&#x27;);
            return;
          }
          cerrarSelector();
          google.script.run.withSuccessHandler(onData).withFailureHandler(onError)
            .assignBlock(pickerCtx.dia, pickerCtx.slot, id, claveSemana());
        });
      });
    }

    function cerrarSelector() {
      var b = document.getElementById(&#x27;pickerBackdrop&#x27;);
      if (b &amp;&amp; b.parentNode) b.parentNode.removeChild(b);
    }

    // Crea un pendiente nuevo y lo agenda de una vez en el bloque tocado.
    function crearPendienteEnBloque(dayIdx, slotMin) {
      var titulo = prompt(&#x27;Nuevo pendiente para &#x27; + state.dayNames[dayIdx] + &#x27; a las &#x27; + fmtMin(slotMin) + &#x27;:&#x27;);
      if (!titulo) return;
      titulo = String(titulo).trim();
      if (!titulo) return;

      var payload = {
        tarea: titulo,
        importancia: 3,
        riesgo: 3,
        recompensa: 3,
        esfuerzo: state.slotMin,
        fechaLimite: &#x27;&#x27;
      };
      var note = document.getElementById(&#x27;syncNote&#x27;);
      if (note) note.textContent = &#x27;guardando…&#x27;;

      google.script.run.withSuccessHandler(function (data) {
        onData(data);
        var creada = null;
        (data.tasks || []).forEach(function (t) {
          if (t.tarea === titulo &amp;&amp; (!creada || String(t.id) &gt; String(creada.id))) creada = t;
        });
        if (creada) {
          google.script.run.withSuccessHandler(onData).withFailureHandler(onError)
            .assignBlock(dayIdx, slotMin, creada.id, claveSemana());
        }
      }).withFailureHandler(onError).addTask(payload);
    }

    /* ===================== TIME BOXING (contenedor) ===================== */
    function renderTimeBoxing(lightweight) {
      if (lightweight &amp;&amp; document.getElementById(&#x27;tbRoot&#x27;)) {
        // solo repintar lo dependiente del reloj, sin reconstruir todo el DOM
        if (tbSub === &#x27;dia&#x27;) paintDayNowHighlight();
        return;
      }
      var html = &#x27;&lt;div id=&quot;tbRoot&quot;&gt;&#x27;;
      html += &#x27;&lt;div class=&quot;subTabs&quot;&gt;&#x27;;
      html += &#x27;&lt;button class=&quot;subTabBtn &#x27; + (tbSub === &#x27;dia&#x27; ? &#x27;active&#x27; : &#x27;&#x27;) + &#x27;&quot; id=&quot;subDia&quot;&gt;DÍA&lt;/button&gt;&#x27;;
      html += &#x27;&lt;button class=&quot;subTabBtn &#x27; + (tbSub === &#x27;semana&#x27; ? &#x27;active&#x27; : &#x27;&#x27;) + &#x27;&quot; id=&quot;subSemana&quot;&gt;SEMANA&lt;/button&gt;&#x27;;
      html += &#x27;&lt;/div&gt;&#x27;;
      html += &#x27;&lt;div id=&quot;tbContent&quot;&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
      document.getElementById(&#x27;main&#x27;).innerHTML = html;

      document.getElementById(&#x27;subDia&#x27;).addEventListener(&#x27;click&#x27;, function () { tbSub = &#x27;dia&#x27;; renderTimeBoxing(); });
      document.getElementById(&#x27;subSemana&#x27;).addEventListener(&#x27;click&#x27;, function () { tbSub = &#x27;semana&#x27;; renderTimeBoxing(); });

      if (selectedDayIndex === null) {
        // La vista Día siempre abre en el día de hoy.
        selectedDayIndex = nowDayIndex();
      }

      if (tbSub === &#x27;dia&#x27;) renderDia();
      else renderSemana();
    }

    function paintDayNowHighlight() {
      var curDay = clientNow.getDay();
      var currentDayIndex = nowDayIndex();
      if (selectedDayIndex !== currentDayIndex) return;
      var nowMin = clientNow.getHours() * 60 + clientNow.getMinutes();
      document.querySelectorAll(&#x27;#tbContent tr[data-slot]&#x27;).forEach(function (tr) {
        var slotMin = Number(tr.getAttribute(&#x27;data-slot&#x27;));
        var isNow = nowMin &gt;= slotMin &amp;&amp; nowMin &lt; slotMin + state.slotMin;
        tr.classList.toggle(&#x27;nowRow&#x27;, isNow);
      });
    }

    /* ===================== TIME BOXING → DÍA ===================== */
    function renderDia() {
      var weekStart = weekStartActual();
      var dayDate = addDays(weekStart, selectedDayIndex);
      var curDay = clientNow.getDay();
      var currentDayIndex = nowDayIndex();
      var occ = buildOccupancy();
      var slots = daySlots(selectedDayIndex);

      // Ordenados por calificación total (puntaje), de mayor a menor.
      var rankeados = state.tasks.filter(function (t) { return t.estado !== &#x27;Completada&#x27;; })
        .sort(function (a, b) { return b.puntaje - a.puntaje; });
      var topPriority = rankeados.slice(0, 3);   // puestos 1-3
      var brainDump = rankeados.slice(3, 10);    // puestos 4-10

      var navHtml = &#x27;&lt;button class=&quot;dayNavBtn&quot; id=&quot;dayPrev&quot;&gt;‹&lt;/button&gt;&#x27;;
      navHtml += &#x27;&lt;div class=&quot;navInlineMain&quot;&gt;&lt;b&gt;&#x27; + state.dayNames[selectedDayIndex] +
        (selectedDayIndex === currentDayIndex ? &#x27; · hoy&#x27; : &#x27;&#x27;) + &#x27;&lt;/b&gt;&#x27; +
        &#x27;&lt;span&gt;&#x27; + dayDate.toLocaleDateString(undefined, { day: &#x27;2-digit&#x27;, month: &#x27;short&#x27; }) + &#x27;&lt;/span&gt;&lt;/div&gt;&#x27;;
      navHtml += &#x27;&lt;button class=&quot;dayNavBtn&quot; id=&quot;dayNext&quot;&gt;›&lt;/button&gt;&#x27;;
      var navBox = document.getElementById(&#x27;navInline&#x27;);
      if (navBox) { navBox.innerHTML = navHtml; navBox.style.display = &#x27;flex&#x27;; }

      var html = &#x27;&#x27;;

      // TOP 3: los tres pendientes de mayor calificación.
      // Lista única de las 10 prioridades: las 3 primeras resaltadas.
      var top10 = rankeados.slice(0, 10);
      html += &#x27;&lt;div class=&quot;boxCard&quot;&gt;&lt;div class=&quot;boxTitleRow&quot;&gt;&#x27; +
        &#x27;&lt;span class=&quot;boxTitle&quot; style=&quot;margin:0;&quot;&gt;Top Prioridades&lt;/span&gt;&#x27; +
        &#x27;&lt;button class=&quot;toggleBox&quot; id=&quot;togglePrio&quot;&gt;&#x27; + (verPrioridades ? &#x27;ocultar ▲&#x27; : &#x27;ver ▼&#x27;) + &#x27;&lt;/button&gt;&#x27; +
        &#x27;&lt;/div&gt;&#x27;;
      html += &#x27;&lt;div class=&quot;prioBody&quot; style=&quot;&#x27; + (verPrioridades ? &#x27;&#x27; : &#x27;display:none;&#x27;) + &#x27;&quot;&gt;&#x27;;
      if (top10.length === 0) html += &#x27;&lt;div class=&quot;emptyNote&quot;&gt;No hay pendientes.&lt;/div&gt;&#x27;;
      top10.forEach(function (t, i) {
        var esTop = i &lt; 3;
        var ag = (state.assignments || []).find(function (a) { return a.idTarea === t.id; });
        var corriendo = !!t.cronometroInicio;
        html += &#x27;&lt;div class=&quot;priorityRow&#x27; + (esTop ? &#x27; isTop&#x27; : &#x27; isRest&#x27;) + &#x27;&quot;&gt;&#x27; +
          &#x27;&lt;span class=&quot;priorityRank&#x27; + (esTop ? &#x27;&#x27; : &#x27; dumpRank&#x27;) + &#x27;&quot;&gt;&#x27; + (i + 1) + &#x27;&lt;/span&gt;&#x27; +
          &#x27;&lt;span class=&quot;priorityText&quot;&gt;&#x27; + escapeHtml(t.tarea) + &#x27;&lt;/span&gt;&#x27; +
          // Columnas alineadas a la derecha
          &#x27;&lt;span class=&quot;colPlan&quot;&gt;&#x27; +
            (ag
              ? &#x27;&lt;button class=&quot;rowPlan&quot; data-replan=&quot;&#x27; + t.id + &#x27;&quot;&gt;📅 &#x27; + escapeHtml(textoPlaneado(ag)) + &#x27;&lt;/button&gt;&#x27;
              : &#x27;&lt;button class=&quot;rowPlan vacio&quot; data-replan=&quot;&#x27; + t.id + &#x27;&quot;&gt;📅 agendar&lt;/button&gt;&#x27;) +
          &#x27;&lt;/span&gt;&#x27; +
          &#x27;&lt;span class=&quot;colNota&quot;&gt;&#x27; +
            (esTop ? &#x27;&lt;span class=&quot;gradeBadge&quot; style=&quot;&#x27; + gradeColorCss(t.calificacion) + &#x27;&quot;&gt;&#x27; + t.calificacion + &#x27;&lt;/span&gt;&#x27; : &#x27;&#x27;) +
          &#x27;&lt;/span&gt;&#x27; +
          &#x27;&lt;span class=&quot;colVence&quot;&gt;&#x27; + deadlineBadge(t) + &#x27;&lt;/span&gt;&#x27; +
          // Iniciar / pausar el cronómetro de la tarea
          &#x27;&lt;span class=&quot;colPlay&quot;&gt;&lt;button class=&quot;playBtn&#x27; + (corriendo ? &#x27; on&#x27; : &#x27;&#x27;) + &#x27;&quot; data-timer=&quot;&#x27; + t.id + &#x27;&quot; title=&quot;&#x27; +
            (corriendo ? &#x27;Pausar&#x27; : &#x27;Iniciar tarea&#x27;) + &#x27;&quot;&gt;&#x27; + (corriendo ? &#x27;⏸&#x27; : &#x27;▶&#x27;) + &#x27;&lt;/button&gt;&lt;/span&gt;&#x27; +
          // Marcar completado, al extremo derecho
          &#x27;&lt;span class=&quot;colCheck2&quot;&gt;&lt;input type=&quot;checkbox&quot; class=&quot;checkbox pCheck&quot; data-done=&quot;&#x27; + t.id + &#x27;&quot; title=&quot;Marcar completado&quot;&gt;&lt;/span&gt;&#x27; +
          &#x27;&lt;/div&gt;&#x27;;
      });
      html += &#x27;&lt;/div&gt;&#x27;;
      html += &#x27;&lt;/div&gt;&#x27;;

      html += &#x27;&lt;div class=&quot;boxCard&quot;&gt;&lt;div class=&quot;boxTitle&quot;&gt;Horario&lt;/div&gt;&#x27;;
      html += leyendaColores();
      if (slots.length === 0) {
        html += &#x27;&lt;div class=&quot;emptyNote&quot;&gt;Sin horario laboral definido este día.&lt;/div&gt;&#x27;;
      } else {
        html += &#x27;&lt;div class=&quot;hourScroll&quot;&gt;&lt;table class=&quot;hourTable&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;hr&lt;/th&gt;&lt;th&gt;:00&lt;/th&gt;&lt;th&gt;:30&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&#x27;;
        var hours = horasComunes();
        hours.forEach(function (h) {
          var m00 = h * 60, m30 = h * 60 + 30;
          html += &#x27;&lt;tr data-slot=&quot;&#x27; + m00 + &#x27;&quot;&gt;&#x27;;
          html += &#x27;&lt;td class=&quot;hrCell&quot;&gt;&lt;span class=&quot;hrGrip&quot;&gt;&lt;/span&gt;&#x27; + pad(h) + &#x27;&lt;/td&gt;&#x27;;
          [m00, m30].forEach(function (slotMin) {
            if (slots.indexOf(slotMin) === -1) { html += &#x27;&lt;td class=&quot;slotOff&quot;&gt;&lt;/td&gt;&#x27;; return; }
            var info = cellContent(selectedDayIndex, slotMin, occ);
            html += renderCellTd(selectedDayIndex, slotMin, info);
          });
          html += &#x27;&lt;/tr&gt;&#x27;;
        });
        html += &#x27;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&#x27;;
      }
      html += &#x27;&lt;/div&gt;&#x27;;

      // ---- Planeadas antes y aún sin ejecutar ----
      var atrasadas = tareasNoEjecutadas();
      html += &#x27;&lt;div class=&quot;boxCard&quot;&gt;&lt;div class=&quot;boxTitleRow&quot;&gt;&#x27; +
        &#x27;&lt;span class=&quot;boxTitle&quot; style=&quot;margin:0;&quot;&gt;No ejecutadas · planeadas antes&lt;/span&gt;&#x27; +
        &#x27;&lt;span class=&quot;countPill&#x27; + (atrasadas.length ? &#x27; alert&#x27; : &#x27;&#x27;) + &#x27;&quot;&gt;&#x27; + atrasadas.length + &#x27;&lt;/span&gt;&#x27; +
        &#x27;&lt;/div&gt;&#x27;;
      if (atrasadas.length === 0) {
        html += &#x27;&lt;div class=&quot;emptyNote&quot;&gt;Nada quedó pendiente de días anteriores.&lt;/div&gt;&#x27;;
      } else {
        html += &#x27;&lt;div class=&quot;emptyNote&quot;&gt;Estas tareas tenían horario en días que ya pasaron y siguen sin completarse.&lt;/div&gt;&#x27;;
        atrasadas.forEach(function (x) {
          var t = x.tarea, ag = x.asig;
          var corr = !!t.cronometroInicio;
          html += &#x27;&lt;div class=&quot;priorityRow isLate&quot;&gt;&#x27; +
            &#x27;&lt;span class=&quot;priorityRank lateRank&quot;&gt;!&lt;/span&gt;&#x27; +
            &#x27;&lt;span class=&quot;priorityText&quot;&gt;&#x27; + escapeHtml(t.tarea) + &#x27;&lt;/span&gt;&#x27; +
            &#x27;&lt;span class=&quot;colPlan&quot;&gt;&lt;button class=&quot;rowPlan late&quot; data-replan=&quot;&#x27; + t.id + &#x27;&quot;&gt;📅 &#x27; +
              escapeHtml(textoPlaneado(ag)) + &#x27;&lt;/button&gt;&lt;/span&gt;&#x27; +
            &#x27;&lt;span class=&quot;colNota&quot;&gt;&lt;span class=&quot;gradeBadge&quot; style=&quot;&#x27; + gradeColorCss(t.calificacion) + &#x27;&quot;&gt;&#x27; + t.calificacion + &#x27;&lt;/span&gt;&lt;/span&gt;&#x27; +
            &#x27;&lt;span class=&quot;colVence&quot;&gt;&#x27; + deadlineBadge(t) + &#x27;&lt;/span&gt;&#x27; +
            &#x27;&lt;span class=&quot;colPlay&quot;&gt;&lt;button class=&quot;playBtn&#x27; + (corr ? &#x27; on&#x27; : &#x27;&#x27;) + &#x27;&quot; data-timer=&quot;&#x27; + t.id + &#x27;&quot; title=&quot;&#x27; +
              (corr ? &#x27;Pausar&#x27; : &#x27;Iniciar tarea&#x27;) + &#x27;&quot;&gt;&#x27; + (corr ? &#x27;⏸&#x27; : &#x27;▶&#x27;) + &#x27;&lt;/button&gt;&lt;/span&gt;&#x27; +
            &#x27;&lt;span class=&quot;colCheck2&quot;&gt;&lt;input type=&quot;checkbox&quot; class=&quot;checkbox pCheck&quot; data-done=&quot;&#x27; + t.id + &#x27;&quot; title=&quot;Marcar completado&quot;&gt;&lt;/span&gt;&#x27; +
            &#x27;&lt;/div&gt;&#x27;;
        });
      }
      html += &#x27;&lt;/div&gt;&#x27;;

      document.getElementById(&#x27;tbContent&#x27;).innerHTML = html;

      var tp = document.getElementById(&#x27;togglePrio&#x27;);
      if (tp) tp.addEventListener(&#x27;click&#x27;, function () {
        verPrioridades = !verPrioridades;
        renderTimeBoxing();
      });

      // Iniciar / pausar cronómetro desde la lista de prioridades
      document.querySelectorAll(&#x27;.playBtn&#x27;).forEach(function (el) {
        el.addEventListener(&#x27;click&#x27;, function () {
          var id = el.getAttribute(&#x27;data-timer&#x27;);
          var t = taskById(id);
          var fn = (t &amp;&amp; t.cronometroInicio) ? &#x27;stopTimer&#x27; : &#x27;startTimer&#x27;;
          google.script.run.withSuccessHandler(onData).withFailureHandler(onError)[fn](id);
        });
      });

      // Marcar completado desde la lista de prioridades
      document.querySelectorAll(&#x27;.pCheck&#x27;).forEach(function (el) {
        el.addEventListener(&#x27;change&#x27;, function () {
          google.script.run.withSuccessHandler(onData).withFailureHandler(onError)
            .toggleDone(el.getAttribute(&#x27;data-done&#x27;));
        });
      });

      // Cambiar la fecha planeada desde la lista de prioridades
      document.querySelectorAll(&#x27;[data-replan]&#x27;).forEach(function (el) {
        el.addEventListener(&#x27;click&#x27;, function () {
          var id = el.getAttribute(&#x27;data-replan&#x27;);
          var ag = (state.assignments || []).find(function (a) { return a.idTarea === id; });
          if (ag) {
            // Ya tiene horario: quitarlo primero y volver a elegir.
            google.script.run.withSuccessHandler(function (d) {
              onData(d);
              abrirAgendarDesdePendiente(id);
            }).withFailureHandler(onError).removeAssignment(ag.id);
          } else {
            abrirAgendarDesdePendiente(id);
          }
        });
      });

      document.getElementById(&#x27;dayPrev&#x27;).addEventListener(&#x27;click&#x27;, function () { selectedDayIndex = moverDia(selectedDayIndex, -1); renderTimeBoxing(); });
      document.getElementById(&#x27;dayNext&#x27;).addEventListener(&#x27;click&#x27;, function () { selectedDayIndex = moverDia(selectedDayIndex, 1); renderTimeBoxing(); });

      wireCellClicks();

      paintDayNowHighlight();
    }

    // Tareas que tenían horario en un día ya pasado y siguen sin completarse.
    function tareasNoEjecutadas() {
      var hoy = new Date(clientNow.getFullYear(), clientNow.getMonth(), clientNow.getDate());
      var lista = [];
      (state.assignments || []).forEach(function (a) {
        var t = taskById(a.idTarea);
        if (!t || t.estado === &#x27;Completada&#x27;) return;

        var sem = normSemana(a.semana);
        if (!sem) return;
        var p = sem.split(&#x27;-&#x27;);
        var lunes = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
        if (isNaN(lunes.getTime())) return;
        var fecha = new Date(lunes);
        fecha.setDate(fecha.getDate() + a.dia);

        if (fecha &lt; hoy) lista.push({ tarea: t, asig: a, fecha: fecha });
      });
      // Más antiguas primero
      lista.sort(function (x, y) { return x.fecha - y.fecha; });
      return lista;
    }

    /* ===================== TIME BOXING → SEMANA (apilada) ===================== */
    function renderSemana() {
      var weekStart = weekStartActual();
      var curDay = clientNow.getDay();
      var currentDayIndex = nowDayIndex();
      var occ = buildOccupancy();

      var asignadasSemana = asignacionesVisibles();
      var unscheduled = state.tasks.filter(function (t) {
        return t.estado !== &#x27;Completada&#x27; &amp;&amp; !asignadasSemana.find(function (a) { return a.idTarea === t.id; });
      });

      var finSemana = addDays(weekStart, state.dayNames.length - 1);
      var etiquetaSemana = weekOffset === 0 ? &#x27;Esta semana&#x27;
        : (weekOffset === 1 ? &#x27;Semana siguiente&#x27;
          : (weekOffset === -1 ? &#x27;Semana anterior&#x27;
            : (weekOffset &gt; 0 ? &#x27;En &#x27; + weekOffset + &#x27; semanas&#x27; : &#x27;Hace &#x27; + Math.abs(weekOffset) + &#x27; semanas&#x27;)));

      var navHtml = &#x27;&lt;button class=&quot;dayNavBtn&quot; id=&quot;semPrev&quot;&gt;‹&lt;/button&gt;&#x27;;
      navHtml += &#x27;&lt;div class=&quot;navInlineMain&quot;&gt;&lt;b&gt;&#x27; + etiquetaSemana + &#x27;&lt;/b&gt;&#x27; +
        &#x27;&lt;span&gt;&#x27; + weekStart.toLocaleDateString(undefined, { day: &#x27;2-digit&#x27;, month: &#x27;short&#x27; }) + &#x27; – &#x27; +
        finSemana.toLocaleDateString(undefined, { day: &#x27;2-digit&#x27;, month: &#x27;short&#x27; }) + &#x27;&lt;/span&gt;&lt;/div&gt;&#x27;;
      navHtml += &#x27;&lt;button class=&quot;dayNavBtn&quot; id=&quot;semNext&quot;&gt;›&lt;/button&gt;&#x27;;
      var navBox = document.getElementById(&#x27;navInline&#x27;);
      if (navBox) { navBox.innerHTML = navHtml; navBox.style.display = &#x27;flex&#x27;; }

      var html = &#x27;&#x27;;
      if (weekOffset !== 0) {
        html += &#x27;&lt;button class=&quot;weekToday&quot; id=&quot;semHoy&quot;&gt;Volver a esta semana&lt;/button&gt;&#x27;;
      }

      html += &#x27;&lt;div class=&quot;weekHint&quot;&gt;Toca cualquier bloque libre para crear un pendiente ahí o elegir uno de tus 10 prioridades.&lt;/div&gt;&#x27;;

      state.dayNames.forEach(function (name, di) {
        var dayDate = addDays(weekStart, di);
        var slots = daySlots(di);
        // Día desactivado en Ajustes: no se muestra en el calendario.
        if (slots.length === 0) return;
        html += &#x27;&lt;div class=&quot;weekDayBlock&quot;&gt;&lt;div class=&quot;weekDayHead&quot;&gt;&#x27;;
        html += &#x27;&lt;span class=&quot;weekDayName &#x27; + (di === currentDayIndex ? &#x27;today&#x27; : &#x27;&#x27;) + &#x27;&quot;&gt;&#x27; + name + &#x27;&lt;/span&gt;&#x27;;
        html += &#x27;&lt;span class=&quot;weekDayDate&quot;&gt;&#x27; + dayDate.toLocaleDateString(undefined, { day: &#x27;2-digit&#x27;, month: &#x27;short&#x27; }) + &#x27;&lt;/span&gt;&#x27;;
        html += &#x27;&lt;/div&gt;&#x27;;
        html += &#x27;&lt;div class=&quot;hourScroll&quot;&gt;&lt;table class=&quot;hourTable&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;hr&lt;/th&gt;&lt;th&gt;:00&lt;/th&gt;&lt;th&gt;:30&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&#x27;;

    // Leyenda de colores: cada tarea se pinta según su cuadrante.
    function leyendaColores() {
      var h = &#x27;&lt;div class=&quot;legend&quot;&gt;&#x27;;
      [&#x27;hacer&#x27;, &#x27;planificar&#x27;, &#x27;delegar&#x27;, &#x27;eliminar&#x27;].forEach(function (k) {
        var m = QUADRANT_META[k];

      });

    }

    function renderCellTd(dayIdx, slotMin, info) {
      if (info.type === &#x27;fixed&#x27;) {
        return &#x27;&lt;td&gt;&lt;div class=&quot;slotFixed&quot; data-cellday=&quot;&#x27; + dayIdx + &#x27;&quot; data-cellslot=&quot;&#x27; + slotMin + &#x27;&quot;&gt;🔒 &#x27; + escapeHtml(info.label) + &#x27;&lt;/div&gt;&lt;/td&gt;&#x27;;
      }

      if (info.type === &#x27;real&#x27; || info.type === &#x27;auto&#x27;) {
        // Toda la franja que ocupa la tarea se colorea según su cuadrante,
        // así se ve de un vistazo dónde empieza y dónde termina.
        var meta = QUADRANT_META[(info.task || {}).cuadrante] || QUADRANT_META.planificar;
        var color = meta.color;
        var hecha = info.task &amp;&amp; info.task.estado === &#x27;Completada&#x27;;
        var clase = &#x27;slotCell filled&#x27;;
        if (hecha) clase += &#x27; hecha&#x27;;
        if (!info.inicio) clase += &#x27; cont&#x27;;
        if (info.total &gt; 1) clase += (info.inicio ? &#x27; spanStart&#x27; : (info.indice === info.total - 1 ? &#x27; spanEnd&#x27; : &#x27; spanMid&#x27;));

        var estilo = hecha
          ? &#x27;background:#131A2166; border-left:4px solid #2A3846; color:#6C7A89;&#x27;
          : (&#x27;background:&#x27; + color + &#x27;26; border-left:4px solid &#x27; + color + &#x27;; color:&#x27; + color + &#x27;;&#x27;);
        if (info.total &gt; 1 &amp;&amp; !info.inicio) estilo += &#x27; border-top:1px dashed &#x27; + color + &#x27;44;&#x27;;

        // El nombre se repite en TODOS los bloques que ocupa la tarea. Con la
        // rejilla de columnas :00 / :30 una tarea larga salta de columna, y sin
        // repetir el nombre no se entendía qué bloques cubría.
        var nombre = escapeHtml(info.task ? info.task.tarea : &#x27;&#x27;);
        var etiqueta = &#x27;&lt;span class=&quot;taskName&quot;&gt;&#x27; + nombre + &#x27;&lt;/span&gt;&#x27;;
        if (info.total &gt; 1) {
          if (info.inicio) {
            etiqueta += &#x27; &lt;span class=&quot;dur&quot;&gt;· &#x27; + fmtEstimado(info.total * state.slotMin) + &#x27;&lt;/span&gt;&#x27;;
          } else {
            etiqueta += &#x27; &lt;span class=&quot;dur&quot;&gt;· &#x27; + (info.indice + 1) + &#x27;/&#x27; + info.total + &#x27;&lt;/span&gt;&#x27;;
          }
        }
        // Acciones del bloque (solo en el primer bloque de la tarea):
        // iniciar/pausar tiempo, marcar completada y quitar del horario.
        var botonPlay = &#x27;&#x27;;
        if (info.inicio &amp;&amp; info.task) {
          var run = !!info.task.cronometroInicio;
          botonPlay = &#x27;&lt;span class=&quot;blockActs&quot;&gt;&#x27;;
          if (!hecha) {
            botonPlay += &#x27;&lt;button class=&quot;blockAct play&#x27; + (run ? &#x27; on&#x27; : &#x27;&#x27;) + &#x27;&quot; data-act=&quot;timer&quot; data-id=&quot;&#x27; + info.task.id +
              &#x27;&quot; title=&quot;&#x27; + (run ? &#x27;Pausar tiempo&#x27; : &#x27;Iniciar tiempo&#x27;) + &#x27;&quot;&gt;&#x27; + (run ? &#x27;⏸&#x27; : &#x27;▶&#x27;) + &#x27;&lt;/button&gt;&#x27;;
          }
          botonPlay += &#x27;&lt;button class=&quot;blockAct done&#x27; + (hecha ? &#x27; on&#x27; : &#x27;&#x27;) + &#x27;&quot; data-act=&quot;done&quot; data-id=&quot;&#x27; + info.task.id +
            &#x27;&quot; title=&quot;&#x27; + (hecha ? &#x27;Marcar como pendiente&#x27; : &#x27;Marcar completada&#x27;) + &#x27;&quot;&gt;✓&lt;/button&gt;&#x27;;
          botonPlay += &#x27;&lt;button class=&quot;blockAct sub&quot; data-act=&quot;sub&quot; data-id=&quot;&#x27; + info.task.id +
            &#x27;&quot; title=&quot;Crear tarea derivada de esta&quot;&gt;＋&lt;/button&gt;&#x27;;
          botonPlay += &#x27;&lt;button class=&quot;blockAct del&quot; data-act=&quot;remove&quot; data-id=&quot;&#x27; + info.blockId +
            &#x27;&quot; title=&quot;Quitar de este horario&quot;&gt;✕&lt;/button&gt;&#x27;;
          botonPlay += &#x27;&lt;/span&gt;&#x27;;
        }
        return &#x27;&lt;td&gt;&lt;div class=&quot;&#x27; + clase + &#x27;&quot; style=&quot;&#x27; + estilo + &#x27;&quot; data-cellday=&quot;&#x27; + dayIdx + &#x27;&quot; data-cellslot=&quot;&#x27; + slotMin + &#x27;&quot;&gt;&#x27; +
               &#x27;&lt;span class=&quot;blockTxt&quot;&gt;&#x27; + etiqueta + &#x27;&lt;/span&gt;&#x27; + botonPlay + &#x27;&lt;/div&gt;&lt;/td&gt;&#x27;;
      }

      var extra = info.pasado ? &#x27; pasado&#x27; : &#x27;&#x27;;
      var mas = info.pasado ? &#x27;&#x27; : &#x27;&lt;span class=&quot;addHint&quot;&gt;+&lt;/span&gt;&#x27;;
      return &#x27;&lt;td&gt;&lt;div class=&quot;slotCell&#x27; + extra + &#x27;&quot; data-cellday=&quot;&#x27; + dayIdx + &#x27;&quot; data-cellslot=&quot;&#x27; + slotMin + &#x27;&quot;&gt;&#x27; + mas + &#x27;&lt;/div&gt;&lt;/td&gt;&#x27;;
    }

    function wireCellClicks() {
      // Acciones del bloque: tiempo, completar y quitar del horario.
      document.querySelectorAll(&#x27;.blockAct&#x27;).forEach(function (b) {
        b.addEventListener(&#x27;click&#x27;, function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
          var acc = b.getAttribute(&#x27;data-act&#x27;);
          var id = b.getAttribute(&#x27;data-id&#x27;);
          if (acc === &#x27;timer&#x27;) {
            var t = taskById(id);
            var fn = (t &amp;&amp; t.cronometroInicio) ? &#x27;stopTimer&#x27; : &#x27;startTimer&#x27;;
            google.script.run.withSuccessHandler(onData).withFailureHandler(onError)[fn](id);
            return;
          }
          if (acc === &#x27;done&#x27;) {
            google.script.run.withSuccessHandler(onData).withFailureHandler(onError).toggleDone(id);
            return;
          }
          if (acc === &#x27;sub&#x27;) {
            crearDerivada(id);
            return;
          }
          if (acc === &#x27;remove&#x27;) {
            if (!confirm(&#x27;¿Quitar esta tarea de este horario?&#x27;)) return;
            google.script.run.withSuccessHandler(onData).withFailureHandler(onError).removeAssignment(id);
          }
        });
      });

      document.querySelectorAll(&#x27;[data-cellday]&#x27;).forEach(function (el) {
        // Evita que un deslizamiento para desplazar abra el bloque por error.
        var y0 = null, x0 = null, arrastro = false;
        el.addEventListener(&#x27;touchstart&#x27;, function (ev) {
          var t = ev.touches &amp;&amp; ev.touches[0];
          if (!t) return;
          y0 = t.clientY; x0 = t.clientX; arrastro = false;
        }, { passive: true });
        el.addEventListener(&#x27;touchmove&#x27;, function (ev) {
          var t = ev.touches &amp;&amp; ev.touches[0];
          if (!t || y0 === null) return;
          if (Math.abs(t.clientY - y0) &gt; 8 || Math.abs(t.clientX - x0) &gt; 8) arrastro = true;
        }, { passive: true });

        el.addEventListener(&#x27;click&#x27;, function (ev) {
          // Si el toque fue sobre un botón del bloque, no abrir el selector.
          if (ev &amp;&amp; ev.target &amp;&amp; ev.target.closest &amp;&amp; ev.target.closest(&#x27;.blockAct&#x27;)) return;
          if (arrastro) { arrastro = false; return; }
          try {
            var di = Number(el.getAttribute(&#x27;data-cellday&#x27;));
            var slotMin = Number(el.getAttribute(&#x27;data-cellslot&#x27;));
            var occ = buildOccupancy();
            var info = cellContent(di, slotMin, occ);
            handleCellClick(di, slotMin, info);
          } catch (e) { renderUiCrash(e); }
        });
      });
    }

    // Al llegar al final de la vista Semana, pasar sola a la semana siguiente.
    var scrollSemanaLigado = false;
    function activarScrollSemana() {
      if (scrollSemanaLigado) return;
      scrollSemanaLigado = true;
      window.addEventListener(&#x27;scroll&#x27;, function () {
        if (tab !== &#x27;timeboxing&#x27; || tbSub !== &#x27;semana&#x27;) return;
        var doc = document.documentElement;
        // Solo avanzar si el usuario insiste al final (evita saltos por inercia).
        var alFinal = (window.innerHeight + window.scrollY) &gt;= (doc.scrollHeight - 4);
        if (!alFinal) { tocandoFinal = 0; return; }
        if (avanzandoSemana) return;
        tocandoFinal++;
        if (tocandoFinal &lt; 12) return;   // hay que seguir empujando abajo
        avanzandoSemana = true;
        tocandoFinal = 0;

        renderSemana();
        window.scrollTo(0, 0);

    /* ===================== MATRIZ ===================== */
    var QUADRANT_META = {
      hacer: { label: &#x27;HACER AHORA&#x27;, sub: &#x27;Urgente + Importante&#x27;, color: &#x27;#FF6B35&#x27;, area: &#x27;hacer&#x27; },
      planificar: { label: &#x27;PLANIFICAR&#x27;, sub: &#x27;Importante, no urgente&#x27;, color: &#x27;#00D9A3&#x27;, area: &#x27;planificar&#x27; },
      delegar: { label: &#x27;DELEGAR&#x27;, sub: &#x27;Urgente, no importante&#x27;, color: &#x27;#FFC145&#x27;, area: &#x27;delegar&#x27; },
      eliminar: { label: &#x27;ELIMINAR&#x27;, sub: &#x27;Ni urgente ni importante&#x27;, color: &#x27;#6C7A89&#x27;, area: &#x27;eliminar&#x27; }
    };
    function jitterFor(id) {
      var h = 0;
      for (var i = 0; i &lt; id.length; i++) h = (h * 31 + id.charCodeAt(i)) | 0;
      var jx = (((h &amp; 0xff) / 255) - 0.5) * 4;
      var jy = ((((h &gt;&gt; 8) &amp; 0xff) / 255) - 0.5) * 4;
      return { jx: jx, jy: jy };
    }
    function clampPct(v) { return Math.max(22, Math.min(78, v)); }

    function renderMatriz() {

      var html = &#x27;&lt;div class=&quot;matrixWrap&quot;&gt;&#x27;;

        html += &#x27;&lt;div class=&quot;quadrant&quot; style=&quot;grid-area:&#x27; + m.area + &#x27;; border-color:&#x27; + m.color + &#x27;55;&quot;&gt;&lt;div class=&quot;quadrantLabel&quot; style=&quot;color:&#x27; + m.color + &#x27;&quot;&gt;&#x27; + m.label + &#x27;&lt;/div&gt;&lt;div class=&quot;quadrantSub&quot;&gt;&#x27; + m.sub + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
      });

      pending.forEach(function (t) {

        var left = clampPct(t.urgencia + j.jx);

      });
      html += &#x27;&lt;/div&gt;&lt;div class=&quot;axisX&quot;&gt;URGENCIA →&lt;/div&gt;&lt;/div&gt;&#x27;;

      var sel = pending.find(function (t) { return t.id === matrixSelectedId; });
      if (sel) {

        html += &#x27;&lt;div class=&quot;detailCard fadeIn&quot;&gt;&lt;div class=&quot;detailTitle&quot;&gt;&#x27; + escapeHtml(sel.tarea) + &#x27;&lt;/div&gt;&#x27;;
        html += &#x27;&lt;div style=&quot;display:flex;align-items:center;gap:10px;&quot;&gt;&lt;span class=&quot;gradeBadge&quot; style=&quot;&#x27; + gradeColorCss(sel.calificacion) + &#x27;&quot;&gt;&#x27; + sel.calificacion + &#x27;&lt;/span&gt;&lt;span class=&quot;detailMeta&quot;&gt;&#x27; + meta.label + &#x27;&lt;/span&gt;&lt;/div&gt;&#x27;;
        html += &#x27;&lt;div class=&quot;detailMeta&quot;&gt;urgencia &#x27; + Math.round(sel.urgencia) + &#x27;/100 · importancia &#x27; + Math.round(sel.importanciaPct !== undefined ? sel.importanciaPct : sel.importancia * 20) + &#x27;/100 · riesgo &#x27; + Math.round(sel.riesgoPct !== undefined ? sel.riesgoPct : sel.riesgo * 20) + &#x27;/100 · recompensa &#x27; + Math.round(sel.recompensaPct !== undefined ? sel.recompensaPct : sel.recompensa * 20) + &#x27;/100&lt;/div&gt;&#x27;;
        html += &#x27;&lt;div class=&quot;detailMeta&quot;&gt;calificación total &#x27; + Math.round(sel.puntaje) + &#x27;/100&lt;/div&gt;&lt;/div&gt;&#x27;;
      } else {

    /* ===================== PENDIENTES / COMPLETADOS ===================== */
    function renderLista(soloCompletados) {

      var html = &#x27;&#x27;;

      if (q) html += &#x27;&lt;button class=&quot;searchClear&quot; id=&quot;limpiarBusqueda&quot;&gt;✕&lt;/button&gt;&#x27;;
      html += &#x27;&lt;/div&gt;&#x27;;
      if (q) {
        html += &#x27;&lt;div class=&quot;searchInfo&quot;&gt;&#x27; + items.length + &#x27; de &#x27; + totalSinFiltrar + &#x27; coinciden con &quot;&#x27; + escapeHtml(busquedaLista) + &#x27;&quot;&lt;/div&gt;&#x27;;

          : (soloCompletados ? &#x27;Todavía no has completado nada.&#x27; : &#x27;No hay pendientes. Agrega uno con &quot;+ nuevo pendiente&quot;.&#x27;)) + &#x27;&lt;/div&gt;&#x27;;

      // ---- Vista de LISTA en tabla (solo Pendientes) ----
      if (listView &amp;&amp; !soloCompletados) {
        html += &#x27;&lt;div class=&quot;tableScroll&quot;&gt;&lt;table class=&quot;listTable&quot;&gt;&#x27;;

        html += &#x27;&lt;th class=&quot;colNum&quot;&gt;Prioridad&lt;/th&gt;&#x27;;
        html += &#x27;&lt;th class=&quot;colFecha&quot;&gt;Límite&lt;/th&gt;&#x27;;
