<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <!-- Ajustes para que se comporte como app al instalarla en el celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0F14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VÉRTICE">
  <title>VÉRTICE</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%230B0F14'/%3E%3Cpath d='M8 8 L20 30 L32 8' fill='none' stroke='%2300D9A3' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%230B0F14'/%3E%3Cpath d='M8 8 L20 30 L32 8' fill='none' stroke='%2300D9A3' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background:#0B0F14; color:#E8EDF2; font-family:'Inter',sans-serif; min-height:100vh; display:flex; flex-direction:column;
      padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); padding-bottom:env(safe-area-inset-bottom);
      -webkit-overflow-scrolling:touch; }
    input, textarea { -webkit-user-select:text; user-select:text; }
    button, input, textarea { font-family: inherit; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background:#223142; border-radius:4px; }
    .fadeIn { animation: fadeIn .2s ease; }
    @keyframes fadeIn { from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

    header { display:flex; justify-content:space-between; align-items:center; padding:16px 18px; border-bottom:1px solid #223142; position:sticky; top:0; background:#0B0F14; z-index:5; }
    .headerLeft { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
    .logoV { width:34px; height:34px; flex-shrink:0; filter:drop-shadow(0 0 6px #00D9A366); }
    .brand { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:21px; letter-spacing:1px; }
    .brandSub { font-size:16px; color:#6C7A89; margin-top:2px; }
    .headerPhrase { flex:1; min-width:0; margin-left:14px; padding-left:14px; border-left:2px solid #00D9A355;
      font-size:15px; font-style:italic; color:#B9F5E4; line-height:1.35; }
    .clockLabel { font-size:14.5px; color:#6C7A89; letter-spacing:1px; text-align:right; }
    .clock { font-family:'JetBrains Mono',monospace; font-size:25px; color:#00D9A3; font-weight:700; text-align:right; }

    nav { display:flex; align-items:center; gap:5px; padding:10px 12px; border-bottom:1px solid #223142; overflow-x:auto; position:sticky; top:70px; background:#0B0F14; z-index:4; }
    .navBtn { background:transparent; border:1px solid transparent; color:#6C7A89; font-family:'Space Grotesk',sans-serif; font-size:17.5px; letter-spacing:.4px; padding:8px 10px; border-radius:6px; white-space:nowrap; cursor:pointer; flex:1; }
    .navBtn.active { color:#E8EDF2; background:#131A21; border-color:#223142; }

    .actionRow { display:flex; align-items:center; gap:9px; padding:10px 16px; border-bottom:1px solid #223142; }
    .addBtn { background:#00D9A3; color:#04110D; border:none; border-radius:8px; padding:12px 16px; font-weight:700; font-size:18.5px; white-space:nowrap; cursor:pointer; }
    .voiceBtn { background:transparent; color:#FFC145; border:1px solid #FFC14566; border-radius:8px; padding:12px 16px; font-weight:700; font-size:18.5px; cursor:pointer; }
    .syncNote { margin-left:auto; font-size:16px; color:#3A4855; font-family:'JetBrains Mono',monospace; }

    .formBar { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; padding:12px 16px; border-bottom:1px solid #223142; background:#0F151B; }
    .field { display:flex; flex-direction:column; gap:4px; }
    .field label { font-size:16px; color:#6C7A89; letter-spacing:.5px; }
    .textInput, .dateInput, .numInput { background:#131A21; border:1px solid #223142; color:#E8EDF2; border-radius:8px; padding:11px 12px; font-size:20px; color-scheme:dark; }
    .textInput { flex:1 1 220px; min-width:180px; }
    .numInput { width:80px; }
    .confirmBtn { background:#FF6B35; border:none; color:#1A0900; font-weight:700; font-size:18.5px; border-radius:8px; padding:12px 18px; cursor:pointer; }
    .rewardChips { display:flex; gap:6px; flex-wrap:wrap; }
    .rewardChip { background:#131A21; border:1px solid #223142; color:#9AA7B4; border-radius:999px; padding:9px 15px; font-size:18px; cursor:pointer; }
    .rewardChip.active { background:#FFC14522; border-color:#FFC145; color:#FFC145; font-weight:700; }
    .rewardChip.riskActive { background:#FF6B3522; border-color:#FF6B35; color:#FF6B35; font-weight:700; }

    main { padding:10px; max-width:100%; margin:0 auto; width:100%; flex:1 0 auto; }
    html { height:auto; }
    html, body { width:100%; overflow-x:hidden; overflow-y:auto; touch-action:manipulation; }
    .emptyNote { font-size:18.5px; color:#6C7A89; padding:8px 0; }
    .errorNote { font-size:18.5px; color:#FF6B35; padding:10px; border:1px solid #FF6B3555; border-radius:8px; background:#1A0F0A; }

    /* Zona de desplazamiento del horario: con barra visible a la derecha,
       para poder bajar a las horas de la tarde también en horizontal. */
    .hourScroll { max-height:62vh; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-right:4px; }
    .hourScroll::-webkit-scrollbar { width:12px; }
    .hourScroll::-webkit-scrollbar-track { background:#0B0F14; border-radius:6px; }
    .hourScroll::-webkit-scrollbar-thumb { background:#2A3846; border-radius:6px; border:3px solid #0B0F14; }
    .hourScroll::-webkit-scrollbar-thumb:active { background:#00D9A3; }
    .hourScroll { scrollbar-width:thin; scrollbar-color:#2A3846 #0B0F14; }
    @media (orientation: landscape) { .hourScroll { max-height:70vh; } }

    /* Subtabs Día/Semana */
    .subTabs { display:flex; gap:6px; margin-bottom:14px; }
    .subTabBtn { flex:1; background:#0F151B; border:1px solid #223142; color:#6C7A89; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18.5px; letter-spacing:.5px; padding:10px; border-radius:8px; cursor:pointer; }
    .subTabBtn.active { color:#00D9A3; border-color:#00D9A3; background:#0F251F; }

    /* Día */
    .dayNavRow { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
    .dayNavBtn { background:#131A21; border:1px solid #223142; color:#E8EDF2; border-radius:6px; width:44px; height:44px; font-size:25px; cursor:pointer; flex-shrink:0; }
    .dayNavTitle { flex:1; text-align:center; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20.5px; }
    .dayNavSub { font-size:16px; color:#6C7A89; font-weight:500; margin-top:1px; text-align:center; }

    .fechaCard { background:#0F151B; border:1px solid #223142; border-radius:10px; padding:12px 14px; margin-bottom:12px; font-size:19px; color:#9AA7B4; }
    .fechaCard b { color:#E8EDF2; }

    .boxCard { background:#0F151B; border:1px solid #223142; border-radius:10px; padding:14px 16px; margin-bottom:14px; }
    .boxTitleRow { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
    .countPill { background:#131A21; border:1px solid #2A3846; color:#9AA7B4; border-radius:999px;
      padding:4px 12px; font-size:14px; font-weight:700; font-family:'JetBrains Mono',monospace; }
    .countPill.alert { background:#FF3B3B1A; border-color:#FF3B3B77; color:#FF6B6B; }
    .priorityRow.isLate { background:#1A0F0F; box-shadow:inset 3px 0 0 #FF3B3B; padding-left:10px; }
    .lateRank { color:#FF6B6B !important; font-weight:700; }
    .rowPlan.late { border-color:#FF3B3B66; color:#FF6B6B; }
    .toggleBox { background:#131A21; border:1px solid #2A3846; color:#9AA7B4; border-radius:999px;
      padding:6px 14px; font-size:14px; cursor:pointer; white-space:nowrap; }
    .boxTitle { font-family:'Space Grotesk',sans-serif; font-size:18.5px; font-weight:700; letter-spacing:.4px; color:#9AA7B4; margin-bottom:8px; text-transform:uppercase; }
    .priorityRow { display:flex; gap:10px; align-items:center; padding:9px 4px; border-bottom:1px solid #223142; font-size:18px; }
    .pCheck { width:24px; height:24px; margin:0; flex-shrink:0; }
    .colPlan { width:186px; flex-shrink:0; display:flex; justify-content:flex-start;
      border-left:1px solid #223142; padding-left:10px; }
    .colNota { width:40px; flex-shrink:0; display:flex; justify-content:center;
      border-left:1px solid #223142; padding-left:10px; }
    .colVence { width:132px; flex-shrink:0; display:flex; justify-content:flex-start;
      border-left:1px solid #223142; padding-left:10px; }
    .colPlay { width:52px; flex-shrink:0; display:flex; justify-content:center;
      border-left:1px solid #223142; padding-left:10px; }
    .colCheck2 { width:42px; flex-shrink:0; display:flex; justify-content:center;
      border-left:1px solid #223142; padding-left:10px; }
    .playBtn { width:38px; height:38px; border-radius:9px; border:1px solid #00D9A366;
      background:#0F251F; color:#00D9A3; font-size:16px; cursor:pointer; }
    .playBtn.on { background:#2A1206; border-color:#FF6B3588; color:#FF6B35; }
    .colPlan .rowPlan { margin-left:0; }
    .colVence .deadlineBadge { margin:0; }
    @media (max-width: 640px) {
      .colPlan { width:150px; }
      .colVence { width:112px; }
      .colPlay { width:46px; }
      .colCheck2 { width:38px; }
      .priorityRow { font-size:16px; gap:7px; }
    }
    /* Celular en vertical: la fila pasa a dos líneas. Arriba el número y el
       nombre a todo el ancho; abajo, en una sola línea, los controles. Así el
       nombre nunca se parte letra por letra. */
    @media (max-width: 760px) {
      .priorityRow { flex-wrap:wrap; row-gap:8px; column-gap:8px; padding:11px 8px; }
      .priorityRow .priorityText { flex:1 1 calc(100% - 34px); min-width:0;
        word-break:normal; overflow-wrap:break-word; line-height:1.3; }
      .priorityRow .colPlan, .priorityRow .colNota, .priorityRow .colVence,
      .priorityRow .colPlay, .priorityRow .colCheck2 {
        width:auto; border-left:none; padding-left:0; }
      .priorityRow .colPlan { margin-left:26px; }
      .priorityRow .colVence { flex:1 1 auto; }
      .priorityRow .colCheck2 { margin-left:auto; }
      .priorityRow .deadlineBadge { font-size:13.5px; padding:3px 9px; white-space:nowrap; }
      .priorityRow .rowPlan { font-size:13px; }
    }
    .priorityRow:last-child { border-bottom:none; }
    .priorityRank { font-family:'JetBrains Mono',monospace; font-weight:700; color:#00D9A3; font-size:17.5px; width:16px; flex-shrink:0; }
    .anchorCard { background:linear-gradient(135deg,#0F251F,#0F151B); border:1px solid #00D9A355; border-left:4px solid #00D9A3; border-radius:10px; padding:14px 16px; margin-bottom:14px; font-size:18px; font-style:italic; color:#B9F5E4; line-height:1.4; }
    .priorityText { flex:1; min-width:0; word-break:break-word; }
    .priorityRank.dumpRank { color:#6C7A89; }
    /* Índice VÉRTICE */
    .verticeCard { background:linear-gradient(160deg,#101C1A,#0F151B); border:1px solid #223142; border-radius:16px; padding:18px; }
    .verticeTop { display:flex; align-items:center; justify-content:space-between; gap:14px; }
    .verticeLabel { font-family:'Space Grotesk',sans-serif; font-size:13.5px; letter-spacing:1.2px; color:#6C7A89; }
    .verticeScore { font-family:'Space Grotesk',sans-serif; font-size:52px; font-weight:700; line-height:1; margin-top:4px; }
    .verticeMax { font-size:22px; color:#6C7A89; font-weight:500; }
    .verticeTag { font-size:16px; font-weight:600; margin-top:2px; }
    .vRing { width:104px; height:104px; flex-shrink:0; }
    .verticeParts { margin-top:16px; padding-top:14px; border-top:1px solid #1A2530; }
    .vPart { margin-bottom:10px; }
    .vPartTop { display:flex; justify-content:space-between; font-size:14.5px; color:#9AA7B4; margin-bottom:4px; }
    .vPartTop b { color:#E8EDF2; font-family:'JetBrains Mono',monospace; }
    .suggestCard { background:#16202A; border:1px solid #00D9A355; border-left:4px solid #00D9A3; border-radius:12px; padding:14px 16px; }
    .suggestLabel { font-size:13.5px; color:#00D9A3; font-weight:700; letter-spacing:.5px; }
    .suggestTitle { font-size:19px; font-weight:600; color:#E8EDF2; margin-top:4px; line-height:1.3; }
    .suggestMeta { font-size:14px; color:#6C7A89; margin-top:4px; }
    .ruleCard { background:#1A140A; border:1px solid #FFC14555; border-radius:12px; padding:14px 16px; font-size:15.5px; color:#FFC145; line-height:1.5; }
    .ruleCard.ok { background:#0F251F; border-color:#00D9A355; color:#00D9A3; }
    .learnCard { border-radius:12px; padding:14px; font-size:16px; line-height:1.5; }
    .learnCard.warn { background:#1A140A; border:1px solid #FFC14555; color:#FFC145; }
    .learnCard.ok { background:#0F251F; border:1px solid #00D9A355; color:#00D9A3; }

    /* Ajustes editables */
    .cfgRow { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:16px; color:#9AA7B4; }
    .cfgChips { display:flex; gap:6px; }
    .cfgChip { background:#131A21; border:1px solid #223142; color:#9AA7B4; border-radius:999px; padding:9px 15px; font-size:15px; cursor:pointer; }
    .cfgChip.on { background:#00D9A322; border-color:#00D9A3; color:#00D9A3; font-weight:700; }
    .cfgDay { padding:10px 0; border-bottom:1px solid #1A2530; }
    .cfgDayHead { display:flex; align-items:center; gap:10px; font-size:17px; color:#E8EDF2; cursor:pointer; }
    .cfgTimes { display:flex; align-items:center; gap:8px; margin-top:8px; margin-left:36px; }
    .cfgTimes.off { opacity:.35; pointer-events:none; }
    .cfgBreak { margin-top:6px; }
    .cfgBreakLbl { display:flex; align-items:center; gap:6px; font-size:14.5px; color:#9AA7B4; white-space:nowrap; }
    .cfgBreakLbl .checkbox { width:20px; height:20px; margin:0; }
    .timeInput { width:86px; background:#131A21; border:1px solid #2A3846; color:#E8EDF2; border-radius:8px; padding:9px 8px; font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:700; text-align:center; }
    .planNow { display:flex; gap:6px; flex-wrap:wrap; }
    .selInput { background:#131A21; border:1px solid #223142; color:#E8EDF2; border-radius:8px; padding:11px 10px; font-size:16px; color-scheme:dark; flex:1 1 auto; min-width:110px; }
    .cancelBtn { background:transparent; border:1px solid #2A3846; color:#9AA7B4; font-size:15.5px; border-radius:8px; padding:12px 16px; cursor:pointer; }
    .rowPlan { background:#131A21; border:1px solid #2A3846; color:#9AA7B4; border-radius:999px; padding:4px 10px; font-size:13.5px; white-space:nowrap; cursor:pointer; margin-left:6px; }
    .rowPlan.vacio { border-style:dashed; color:#6C7A89; }
    .cfgTime { background:#131A21; border:1px solid #223142; color:#E8EDF2; border-radius:8px; padding:9px 10px; font-size:16px; color-scheme:dark; }
    .cfgDash { color:#6C7A89; }
    .cfgSave { width:100%; margin-top:14px; background:#00D9A3; color:#04110D; border:none; border-radius:10px; padding:14px; font-size:17px; font-weight:700; cursor:pointer; }
    .cfgAdd { width:100%; margin-top:12px; background:transparent; border:1px dashed #00D9A366; color:#00D9A3; border-radius:10px; padding:13px; font-size:16px; font-weight:600; cursor:pointer; }
    .cfgFixed { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid #1A2530; }
    .cfgFixedInfo { display:flex; flex-direction:column; gap:2px; min-width:0; }
    .cfgFixedInfo b { color:#E8EDF2; font-size:16.5px; word-break:break-word; }
    .cfgFixedInfo span { color:#6C7A89; font-size:14px; }

    .dumpFreeLabel { font-size:13.5px; color:#6C7A89; letter-spacing:.4px; text-transform:uppercase; margin:12px 0 6px; }

    /* Selector de tarea al tocar un bloque del calendario */
    .pickerBackdrop { position:fixed; inset:0; background:#000000CC; display:flex; align-items:flex-end; justify-content:center; z-index:50; }
    .pickerBox { width:100%; max-width:640px; max-height:82vh; overflow-y:auto; background:#0F151B; border:1px solid #223142; border-radius:16px 16px 0 0; padding:16px; }
    .pickerHead { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px; color:#E8EDF2; margin-bottom:12px; }
    .forceTag { font-size:12.5px; color:#FF6B35; border:1px solid #FF6B3566; border-radius:999px; padding:2px 8px; margin-left:6px; }
    .pickerNew { width:100%; background:#00D9A3; color:#04110D; border:none; border-radius:10px; padding:14px; font-size:17px; font-weight:700; cursor:pointer; }
    .pickerSub { font-size:14px; color:#6C7A89; margin:14px 0 8px; }
    .pickerItem { display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:#131A21; border:1px solid #223142; color:#E8EDF2; border-radius:10px; padding:12px; margin-bottom:6px; font-size:16px; cursor:pointer; }
    .pickerRank { font-family:'JetBrains Mono',monospace; font-weight:700; color:#00D9A3; min-width:20px; }
    .pickerName { flex:1; min-width:0; word-break:break-word; line-height:1.3; }
    .pickerDur { font-family:'JetBrains Mono',monospace; font-size:13.5px; color:#6C7A89; white-space:nowrap; }
    .pickerSearch { width:100%; background:#131A21; border:1px solid #2A3846; color:#E8EDF2;
      border-radius:10px; padding:12px; font-size:16px; margin-bottom:8px; }
    .pickerLista { max-height:44vh; overflow-y:auto; }
    .pickerCancel { width:100%; background:transparent; border:1px solid #2A3846; color:#9AA7B4; border-radius:10px; padding:13px; font-size:16px; margin-top:10px; cursor:pointer; }
    .pickerWhen { font-size:14px; color:#6C7A89; font-weight:500; margin-top:3px; }
    .pickerOpt { display:flex; flex-direction:column; align-items:flex-start; gap:3px; width:100%; text-align:left; background:#131A21; border:1px solid #223142; border-radius:10px; padding:14px; margin-bottom:8px; cursor:pointer; }
    .pickerOpt b { color:#E8EDF2; font-size:17px; font-weight:600; }
    .pickerOpt span { color:#6C7A89; font-size:14px; line-height:1.35; }
    .slotFixed { cursor:pointer; }
    .weekNav { display:flex; align-items:center; gap:10px; margin-bottom:12px; background:#0F151B; border:1px solid #223142; border-radius:12px; padding:10px 12px; }
    .weekNavMain { flex:1; text-align:center; min-width:0; }
    .weekNavTitle { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17.5px; color:#E8EDF2; }
    .weekNavSub { font-size:14px; color:#6C7A89; margin-top:2px; }
    .weekToday { width:100%; background:transparent; border:1px solid #00D9A366; color:#00D9A3; border-radius:10px; padding:11px; font-size:15.5px; font-weight:600; margin-bottom:12px; cursor:pointer; }
    .navInline { display:none; align-items:center; gap:6px; margin-left:auto; background:#0F151B; border:1px solid #223142; border-radius:10px; padding:4px 6px; }
    .navInline .dayNavBtn { width:36px; height:36px; font-size:19px; }
    .navInlineMain { display:flex; flex-direction:column; align-items:center; min-width:92px; line-height:1.15; }
    .navInlineMain b { font-family:'Space Grotesk',sans-serif; font-size:15px; color:#E8EDF2; white-space:nowrap; }
    .navInlineMain span { font-size:12.5px; color:#6C7A89; white-space:nowrap; }
    .weekHint { font-size:14.5px; color:#6C7A89; margin-bottom:12px; line-height:1.4; }
    .priorityRow.isTop { background:#0F251F; box-shadow:inset 3px 0 0 #00D9A3; padding-left:10px; }
    .priorityRow.isRest { opacity:.82; }
    .planBtn { background:#131A21; border:1px solid #00D9A366; color:#00D9A3; border-radius:8px; padding:9px 13px; font-size:15px; font-weight:600; cursor:pointer; }
    .plannedRow { display:flex; align-items:center; gap:6px; }
    .plannedTag { background:#00D9A31A; border:1px solid #00D9A366; color:#00D9A3; border-radius:8px; padding:7px 11px; font-size:14.5px; font-weight:600; }
    .planHoras { display:flex; flex-wrap:wrap; gap:6px; max-height:180px; overflow-y:auto; }
    .cfgChip small { color:#6C7A89; font-size:12px; }
    .dumpInput { width:100%; background:#131A21; border:1px solid #223142; color:#E8EDF2; border-radius:8px; padding:11px 12px; font-size:17px; margin-bottom:6px; }

  <script>
  /* ===================== PUENTE CON EL BACKEND =====================
     Esta versión vive en GitHub Pages, fuera de Apps Script, así que
     google.script.run no existe. Este adaptador lo imita: cada llamada
     viaja a la API por JSONP (evita cualquier bloqueo de CORS) y
     devuelve el resultado a los mismos manejadores de siempre. */
  var VERTICE_API = "https://script.google.com/macros/s/AKfycbwagu5uDuCOJCFKs000lvtXJ6KEIeX2iAJ35qRjgFMdXADK8Z-9jTtZO7LxDKWIyqVF/exec";

  (function () {
    var contador = 0;

    function llamarAPI(fn, args, onOk, onErr) {
      var cb = 'verticeCB' + (++contador) + '_' + Date.now();
      var limpio = false;
      var script = document.createElement('script');

      function limpiar() {
        if (limpio) return;
        limpio = true;
        try { delete window[cb]; } catch (e) { window[cb] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      var expiro = setTimeout(function () {
        limpiar();
        if (onErr) onErr(new Error('La conexión tardó demasiado. Revisa tu internet.'));
      }, 30000);

      window[cb] = function (resp) {
        clearTimeout(expiro);
        limpiar();
        if (resp && resp.ok) { if (onOk) onOk(resp.data); }
        else { if (onErr) onErr(new Error((resp && resp.error) || 'Error desconocido del servidor')); }
      };

      var url = VERTICE_API + '?fn=' + encodeURIComponent(fn) +
                '&args=' + encodeURIComponent(JSON.stringify(args || [])) +
                '&callback=' + cb + '&_=' + Date.now();
      script.src = url;
      script.onerror = function () {
        clearTimeout(expiro);
        limpiar();
        if (onErr) onErr(new Error('No se pudo contactar el servidor.'));
      };
      document.body.appendChild(script);
    }

    // Imita la interfaz de google.script.run
    function crearRunner(onOk, onErr) {
      var runner = {
        withSuccessHandler: function (f) { return crearRunner(f, onErr); },
        withFailureHandler: function (f) { return crearRunner(onOk, f); }
      };
      ['getAppData','addTask','updateTask','toggleDone','deleteTask','startTimer',
       'stopTimer','assignBlock','removeAssignment','getNotes','saveNotes',
       'guardarConfig','ping'].forEach(function (nombre) {
        runner[nombre] = function () {
          llamarAPI(nombre, Array.prototype.slice.call(arguments), onOk, onErr);
        };
      });
      return runner;
    }

    window.google = window.google || {};
    window.google.script = window.google.script || {};
    Object.defineProperty(window.google.script, 'run', {
      get: function () { return crearRunner(null, null); }
    });
  })();
  </script>

    var weekOffset = 0;   // 0 = semana actual, 1 = siguiente, -1 = anterior
    var clientNow = new Date();

    var notesSaveTimer = null;

    function pad(n) { return String(n).padStart(2, '0'); }
    function fmtClock(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
    function fmtDuration(sec) {
      sec = Math.max(0, Math.floor(sec));
      var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
      if (h > 0) return h + 'h ' + pad(m) + 'm';
      return pad(m) + ':' + pad(s);
    }
    function fmtMin(totalMin) { return pad(Math.floor(totalMin / 60)) + ':' + pad(totalMin % 60); }
    // Interpreta texto de duración: "45", "45 min", "1h", "1h 30", "1:30", "2h"
    function parseDuracion(txt) {
      var s = String(txt || '').toLowerCase().trim();
      if (!s) return null;
      var m;
      // formato 1:30
      m = s.match(/^(\d+)\s*:\s*(\d+)$/);
      if (m) return Math.max(10, Number(m[1]) * 60 + Number(m[2]));
      // formato 1h 30 / 1h30m / 1 h
      m = s.match(/^(\d+)\s*h\s*(\d+)?\s*m?$/);
      if (m) return Math.max(10, Number(m[1]) * 60 + (m[2] ? Number(m[2]) : 0));
      // formato 45 / 45 min / 45m
      m = s.match(/^(\d+)\s*(m|min|minutos)?$/);
      if (m) return Math.max(10, Number(m[1]));
      return null;
    }

    // Formatea minutos como "30 min" o "1h 30m"
    function fmtEstimado(min) {
      min = Number(min) || 0;
      if (min < 60) return min + ' min';
      var h = Math.floor(min / 60), m = min % 60;
      return m === 0 ? (h + 'h') : (h + 'h ' + m + 'm');
    }

    function dateKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

    /* ---- MENSAJE DEL DÍA (ancla motivacional) ----
       Para cambiar las frases, edita esta lista. Rota sola: una por día,
       siempre la misma para una fecha dada. Puedes agregar las que quieras. */
    var FRASES_DEL_DIA = [
      "Lo importante rara vez es urgente; hazlo antes de que lo sea.",
      "Un bloque de tiempo protegido vale más que diez intenciones.",
      "Empieza por lo difícil mientras tienes energía.",
      "No estás atrasado: estás priorizando.",
      "Hecho es mejor que perfecto.",
      "Lo que se mide, se mejora.",
      "Cada pendiente viejo pesa más que uno nuevo. Ciérralo.",
      "El enfoque es decir que no a lo bueno para hacer lo esencial.",
      "Avanza 1% hoy; en un año es otra persona.",
      "Planear el día toma 5 minutos y devuelve horas.",
      "La disciplina es recordar lo que quieres de verdad.",
      "No confundas movimiento con progreso.",
      "Termina lo empezado antes de abrir otro frente.",
      "El tiempo no se encuentra: se asigna.",
      "Haz el trabajo profundo temprano; lo demás puede esperar.",
      "Una tarea sin fecha es solo un deseo.",
      "Si todo es prioridad, nada lo es.",
      "El mejor momento para hacerlo era ayer; el segundo mejor es ahora.",
      "Descansar también es parte del plan.",
      "Constancia le gana a intensidad."
    ];
    function fraseDelDia(fecha) {
      if (!FRASES_DEL_DIA.length) return '';
      var inicioAnio = new Date(fecha.getFullYear(), 0, 0);
      var diaDelAnio = Math.floor((fecha - inicioAnio) / 86400000);
      return FRASES_DEL_DIA[diaDelAnio % FRASES_DEL_DIA.length];
    }

    // Estado de la fecha límite de un pendiente, para la alerta en rojo:
    // 'overdue' = ya venció, 'today' = vence hoy, 'soon' = vence en 2 días o menos, null = sin alerta
    function deadlineStatus(t) {
      if (!t.fechaLimite) return null;
      var due = new Date(t.fechaLimite);
      if (isNaN(due.getTime())) return null;
      var todayStart = new Date(clientNow.getFullYear(), clientNow.getMonth(), clientNow.getDate());
      var dueDateOnly = new Date(due.getFullYear(), due.getMonth(), due.getDate());
      var diffDays = Math.round((dueDateOnly - todayStart) / 86400000);
      if (diffDays < 0) return 'overdue';
      if (diffDays === 0) return 'today';
      if (diffDays <= 2) return 'soon';
      return null;
    }
    // Antigüedad del pendiente: cuántos días/semanas lleva desde que se creó.
    function ageInfo(t) {
      if (!t.creadoEn) return null;
      var creado = new Date(t.creadoEn);
      if (isNaN(creado.getTime())) return null;
      var inicio = new Date(creado.getFullYear(), creado.getMonth(), creado.getDate());
      var hoy = new Date(clientNow.getFullYear(), clientNow.getMonth(), clientNow.getDate());
      var dias = Math.round((hoy - inicio) / 86400000);
      if (dias < 0) dias = 0;
      var texto;
      if (dias === 0) texto = 'hoy';
      else if (dias === 1) texto = '1 día';
      else if (dias < 7) texto = dias + ' días';
      else {
        var semanas = Math.floor(dias / 7);
        var resto = dias % 7;
        texto = semanas + (semanas === 1 ? ' sem' : ' sem');
        if (resto > 0) texto += ' ' + resto + 'd';
        texto += ' (' + dias + ' días)';
      }
      return { dias: dias, texto: texto };
    }
    function ageBadge(t) {
      var a = ageInfo(t);
      if (!a) return '';
      var cls = 'ageBadge';
      if (a.dias >= 30) cls += ' ageOld';
      else if (a.dias >= 14) cls += ' ageMid';
      return '<span class="' + cls + '">⏳ ' + escapeHtml(a.texto) + '</span>';
    }

    // Texto legible de una asignación: "Vie 29 ago · 07:00"
    function textoPlaneado(a) {
      var dia = state.dayNames[a.dia] || '';
      var hora = fmtMin(a.horaMin);
      var sem = normSemana(a.semana);
      if (sem) {
        var p = sem.split('-');
        var lunes = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
        if (!isNaN(lunes.getTime())) {
          var fecha = new Date(lunes);
          fecha.setDate(fecha.getDate() + a.dia);
          return dia.slice(0, 3) + ' ' +
            fecha.toLocaleDateString(undefined, { day: '2-digit', month: 'short' }) +
            ' · ' + hora;
        }
      }
      return dia + ' · ' + hora;
    }

    // Fecha corta para la tabla: dd/mm
    function formatoFechaCorta(f) {
      var d = new Date(f);
      if (isNaN(d.getTime())) return String(f).slice(0, 10);
      return pad(d.getDate()) + '/' + pad(d.getMonth() + 1);
    }

    function deadlineBadge(t) {
      var st = deadlineStatus(t);
      if (st === 'overdue') return '<span class="deadlineBadge overdue">⚠️ Vencido</span>';
      if (st === 'today') return '<span class="deadlineBadge today">⚠️ Vence hoy</span>';
      if (st === 'soon') return '<span class="deadlineBadge soon">Vence pronto</span>';
      return '';
    }

    setInterval(function () {
      clientNow = new Date();
      var clockEl = document.getElementById('clock');
      if (clockEl) clockEl.textContent = fmtClock(clientNow);
      if (tab === 'timeboxing' && !lastError && state && Array.isArray(state.tasks) && Array.isArray(state.dayNames) && state.dayNames.length >= 5) {

    /* -------- carga de datos -------- */
    var pingLog = [];
    function loadData() {
      // Diagnóstico temporal: primero probamos con una función que no toca
      // la hoja de cálculo, para aislar si el problema es del puente de
      // Apps Script en general o específico de getAppData()/Sheets.
      google.script.run.withSuccessHandler(function (pingResult) {
        pingLog.push({ t: fmtClock(new Date()), ok: !!(pingResult && pingResult.ok), raw: pingResult });
        if (pingLog.length > 10) pingLog.shift();
        google.script.run.withSuccessHandler(onData).withFailureHandler(onError).getAppData();
      }).withFailureHandler(function (err) {
        pingLog.push({ t: fmtClock(new Date()), ok: false, raw: 'ERROR: ' + (err && err.message ? err.message : String(err)) });
        if (pingLog.length > 10) pingLog.shift();
        google.script.run.withSuccessHandler(onData).withFailureHandler(onError).getAppData();
      }).ping();
    }
    var retryCount = 0;
    function onData(data) {
      // Blindaje: si el servidor devuelve vacío/incompleto en vez de lanzar
      // un error, lo tratamos como error en vez de dejar que la pantalla
      // se rompa leyendo propiedades de null/undefined.
      if (!data || typeof data !== 'object' || !Array.isArray(data.tasks) || !Array.isArray(data.assignments) || !Array.isArray(data.workWindows) || !Array.isArray(data.dayNames) || data.dayNames.length < 5) {
        // Diagnóstico: guardamos exactamente qué llegó, para verlo en el mensaje.
        var raw;
        try { raw = JSON.stringify(data); } catch (e2) { raw = String(data); }
        if (raw && raw.length > 400) raw = raw.slice(0, 400) + '…';

        // Auto-reintento una vez: esto puede ser un fallo pasajero del lado
        // de Google (carga en frío, límite de llamadas simultáneas). Si el
        // reintento también falla, ahí sí mostramos el error persistente.
        if (retryCount < 3) {
          retryCount++;
          var note1 = document.getElementById('syncNote');
          if (note1) note1.textContent = 'reintentando (' + retryCount + '/3)…';
          setTimeout(function () { loadData(); }, 700 * retryCount);
          return;
        }

        lastError = 'El servidor devolvió una respuesta vacía o incompleta tras 3 reintentos. Dato crudo recibido: ' + escapeHtml(raw === undefined ? 'undefined' : (raw === 'null' ? 'null (literal)' : raw));
        var note0 = document.getElementById('syncNote');
        if (note0) note0.textContent = 'error';
        renderErrorBanner();
        return;
      }
      retryCount = 0;
      state = data;
      lastError = null;
      lastSyncOk = new Date();
      var note = document.getElementById('syncNote');
      if (note) note.textContent = 'sync ' + fmtClock(lastSyncOk);
      render();
    }
    function onError(err) {
      lastError = (err && err.message) ? err.message : String(err);
      var note = document.getElementById('syncNote');
      if (note) note.textContent = 'error';
      renderErrorBanner();
    }
    function renderErrorBanner() {
      var html = '<div class="errorNote">No se pudo guardar/cargar: <b>' + escapeHtml(lastError) + '</b>';
      html += '<br><br>Si acabas de pegar un cambio de código, ve a Implementar → Administrar implementaciones → editar (✏️) → Versión: Nueva versión → Implementar, para que la URL use el código actualizado.';
      if (pingLog.length > 0) {
        html += '<br><br><b>Registro de diagnóstico (ping):</b><br>';
        pingLog.forEach(function (p) {
          var rawStr;
          try { rawStr = JSON.stringify(p.raw); } catch (e3) { rawStr = String(p.raw); }
          html += escapeHtml(p.t) + ' — ' + (p.ok ? 'OK' : 'FALLÓ') + ' — ' + escapeHtml(rawStr) + '<br>';
        });
      }
      html += '<br><button class="confirmBtn" id="retryBtn">Reintentar</button></div>';
      document.getElementById('main').innerHTML = html;
      var retryBtn = document.getElementById('retryBtn');
      if (retryBtn) retryBtn.addEventListener('click', function () {
        var note = document.getElementById('syncNote');
        if (note) note.textContent = 'cargando…';
        loadData();
      });
    }

    /* -------- navegación de pestañas -------- */

    var formReward = 3;

    document.getElementById('fSubmit').addEventListener('click', function () {

      }

      google.script.run.withSuccessHandler(function (data) {

            if (t.tarea === title && (!creada || String(t.id) > String(creada.id))) creada = t;
          });
          if (creada) {
            google.script.run.withSuccessHandler(onData).withFailureHandler(onError)
              .assignBlock(pDia, pHora, creada.id, pClave);
            return;
          }
        }
        onData(data);
      }).withFailureHandler(function (err) {

    function render() {

        actualizarBotonLista();

        if (bp) bp.textContent = fraseDelDia(clientNow);

        if (!state || !Array.isArray(state.tasks) || !Array.isArray(state.assignments) || !Array.isArray(state.workWindows) || !Array.isArray(state.dayNames) || state.dayNames.length < 5) {
          document.getElementById('main').innerHTML = '<div class="emptyNote">Cargando…</div>';
          return;
        }
        if (tab === 'timeboxing') renderTimeBoxing();
        else if (tab === 'matriz') renderMatriz();
        else if (tab === 'pendientes') renderLista(false);
        else if (tab === 'completados') renderLista(true);
        else if (tab === 'dashboard') renderDashboard();
        else if (tab === 'config') renderConfig();
        else renderLista(true);
